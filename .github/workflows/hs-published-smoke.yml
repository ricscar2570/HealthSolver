name: HealthSolver Published Release Smoke
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs-published-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live HealthSolver 0.40 assets
        shell: bash
        run: |
          set -euxo pipefail
          base='https://ricscar2570.github.io/HealthSolver'
          ok=0
          for i in $(seq 1 12); do
            curl -L --fail -H 'Cache-Control: no-cache' "$base/?release=0.40.0&attempt=$i" -o index.html || true
            if grep -q 'HealthSolver 0.40.0' index.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          grep -q 'predictive-engine.js' index.html
          curl -L --fail --retry 8 --retry-delay 5 "$base/version.json" -o version.json
          python - <<'PY'
          import json
          v=json.load(open('version.json'))
          assert v['version']=='0.40.0',v
          assert set(v['predictive_models'])=={'HS-UCI-HD-001','HS-UCI-CKD-001','HS-UCI-BC-001'},v
          print(v)
          PY
          curl -L --fail --retry 8 --retry-delay 5 "$base/predictive-engine.js" -o predictive-engine.js
          grep -q 'HS_PREDICTIVE_ENGINE_040' predictive-engine.js
          curl -L --fail --retry 8 --retry-delay 5 "$base/predictive/model-registry-v2.json" -o registry.json
          python - <<'PY'
          import json
          r=json.load(open('registry.json'))
          assert r['version']=='0.40.0'
          assert len(r['models'])==3
          print([m['model_id'] for m in r['models']])
          PY
          for file in model-heart-disease-v1.json model-ckd-v1.json model-breast-cancer-v1.json; do
            curl -L --fail --retry 8 --retry-delay 5 "$base/predictive/$file" -o "$file"
          done
          python - <<'PY'
          import json
          ids=[]
          for f in ['model-heart-disease-v1.json','model-ckd-v1.json','model-breast-cancer-v1.json']:
              m=json.load(open(f)); ids.append(m['model_id'])
              assert m['metrics_test']['auroc']>0.5
              assert m['research_only'] is True
              assert m['not_clinically_validated'] is True
          assert set(ids)=={'HS-UCI-HD-001','HS-UCI-CKD-001','HS-UCI-BC-001'}
          print(ids)
          PY
