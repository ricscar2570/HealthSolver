name: HealthSolver Published Release Smoke
# 0.56.1 complete-guide + 0.56 transport + ensemble public parity
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/hs-published-smoke.yml'
      - 'predictive/**'
      - 'guide/**'
      - '.github/workflows/hs041-repack-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify live release and public predictive assets
        shell: bash
        run: |
          set -euxo pipefail
          base='https://ricscar2570.github.io/HealthSolver'
          curl -L --fail --retry 8 --retry-delay 3 "$base/version.json?audit=published" -o live-version.json
          curl -L --fail --retry 8 --retry-delay 3 "$base/predictive/model-registry-v2.json?audit=published" -o live-registry.json
          python - <<'PY'
          import json,pathlib,urllib.request
          expected_release='0.56.1'
          expected_registry='0.54.1'
          live=json.load(open('live-version.json'))
          local=json.load(open('predictive/model-registry-v2.json'))
          public=json.load(open('live-registry.json'))
          assert live['version']==expected_release,live
          assert local['version']==expected_registry,local
          assert public==local,'public registry differs from main registry'
          ids=[m['model_id'] for m in local['models']]
          assert live['predictive_model_count']==len(ids)==14,(live,ids)
          assert live['predictive_models']==ids,(live['predictive_models'],ids)
          assert live.get('eicu_demo_hospital_death_integrated') is True,live
          assert live.get('eicu_semantics_remediation') is True,live
          assert live.get('ensemble_intelligence_integrated') is True,live
          assert live.get('ensemble_intelligence_version')=='1.0.0',live
          assert live.get('common_outcome_transport_integrated') is True,live
          assert live.get('common_outcome_transport_version')=='1.0.0',live
          assert live.get('common_outcome_transport_model_id')=='HS-COMMON-HOSPDEATH-TRANSPORT-001',live
          assert live.get('common_outcome_transport_qualification')=='WEAK_TRANSPORT_GENERALIZATION',live
          assert live.get('in_app_guide_integrated') is True,live
          assert live.get('in_app_guide_version')=='1.0.0',live
          assert live.get('in_app_guide_screenshots')==8,live
          assert len(ids)==len(set(ids))
          for e in local['models']:
              url=f"https://ricscar2570.github.io/HealthSolver/predictive/{e['file']}?audit=published"
              with urllib.request.urlopen(url,timeout=30) as r:
                  remote=json.load(r)
              local_model=json.load(open(pathlib.Path('predictive')/e['file']))
              assert remote==local_model,e['file']
          with urllib.request.urlopen("https://ricscar2570.github.io/HealthSolver/predictive/ensemble-intelligence-v1.json?audit=published",timeout=30) as r:
              remote_ensemble=json.load(r)
          local_ensemble=json.load(open('predictive/ensemble-intelligence-v1.json'))
          assert remote_ensemble==local_ensemble,'public ensemble config differs from main'
          with urllib.request.urlopen("https://ricscar2570.github.io/HealthSolver/predictive/common-outcome-transport-v1.json?audit=published",timeout=30) as r:
              remote_transport=json.load(r)
          local_transport=json.load(open('predictive/common-outcome-transport-v1.json'))
          assert remote_transport==local_transport,'public transport model differs from main'
          assert local_transport['base_predictive_model_count_preserved']==14
          assert local_transport['qualification_status']=='WEAK_TRANSPORT_GENERALIZATION'
          guide_paths=[
              'guide/in-app-guide.html','guide/in-app-guide.js',
              'guide/assets/01-clinical-coach.png','guide/assets/02-expert-mode-top.png',
              'guide/assets/03-predictive-results.png','guide/assets/04-transport-layer.png',
              'guide/assets/05-ensemble-intelligence.png','guide/assets/06-hub.png',
              'guide/assets/07-validation.png','guide/assets/08-archive.png'
          ]
          for gp in guide_paths:
              with urllib.request.urlopen(f"https://ricscar2570.github.io/HealthSolver/{gp}?audit=published",timeout=30) as rr:
                  remote_bytes=rr.read()
              assert remote_bytes==pathlib.Path(gp).read_bytes(),gp
          print({'version':live['version'],'registry':local['version'],'models':ids,'ensemble':local_ensemble['version'],'transport':local_transport['version'],'transport_qualification':local_transport['qualification_status'],'guide_files':len(guide_paths),'source_sha256':live['source_sha256']})
          PY
          curl -L --fail --retry 8 --retry-delay 3 "$base/predictive/integrated-predictive-ui.js?audit=published" -o live-ui.js
          cmp predictive/integrated-predictive-ui.js live-ui.js
          curl -L --fail --retry 8 --retry-delay 3 "$base/?audit=published" -o live-index.html
          grep -q 'HealthSolver 0.56.1' live-index.html
