name: HealthSolver 0.43 Predictive-First Visual Audit
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs043-predictive-first-visual-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify predictive-first live UX
        shell: bash
        run: |
          cat > audit.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1400}});
          await page.goto('https://ricscar2570.github.io/HealthSolver/?audit=043-predictive-first',{waitUntil:'networkidle',timeout:120000});
          await page.waitForFunction(()=>document.body.innerText.includes('Clinical Coach') && document.body.innerText.includes('Expert Mode'),{timeout:30000});
          await page.waitForTimeout(1000);

          let expert=page.locator('aside .nav[data-page="intelligence"]');
          if(await expert.count()!==1) expert=page.getByText('Expert Mode',{exact:false}).filter({hasNotText:'Dossier'}).first();
          if(await expert.count()!==1) throw new Error('Expert Mode nav missing after app shell load');
          const navText=await expert.innerText();
          if(!/PREDITTIVO/i.test(navText)) throw new Error('Predictive nav badge missing');
          await expert.click();
          await page.waitForTimeout(500);

          const block=page.locator('#hs-predictive-integrated');
          if(await block.count()!==1) throw new Error('Predictive-first block missing');
          if(!(await block.isVisible())) throw new Error('Predictive-first block not visible');

          const text=await block.innerText();
          for(const needle of ['MOTORE PREDITTIVO','Predizioni cliniche di ricerca','3 MODELLI SUPERVISIONATI','CALCOLA PREDIZIONI','Risultati predittivi']){
            if(!text.includes(needle)) throw new Error('Missing prominent predictive label: '+needle);
          }

          const btn=page.locator('#hs42Run');
          const bb=await btn.boundingBox();
          if(!bb || bb.height < 50 || bb.width < 180) throw new Error('Primary predictive CTA is not visually prominent enough');

          const metrics=block.locator('#hs42Coverage .metric');
          if(await metrics.count()!==3) throw new Error('Expected 3 large model coverage cards');

          await block.scrollIntoViewIfNeeded();
          await block.screenshot({path:'HealthSolver-0.43-Predictive-First.png'});
          await page.screenshot({path:'HealthSolver-0.43-Expert-Mode.png',fullPage:true});
          console.log(text.slice(0,5000));
          await browser.close();
          JS
          node audit.mjs | tee audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: healthsolver-043-predictive-first
          path: |
            HealthSolver-0.43-Predictive-First.png
            HealthSolver-0.43-Expert-Mode.png
            audit.txt
          retention-days: 14
