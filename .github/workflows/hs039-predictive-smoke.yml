name: HealthSolver 0.39 Predictive Smoke
on:
  push:
    branches: ['main']
    paths:
      - 'predictive/**'
      - '.github/workflows/hs039-predictive-smoke.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check predictive/predictive-engine.js
      - name: Model integrity and deterministic inference
        shell: bash
        run: |
          python - <<'PY'
          import json,math,pathlib
          p=pathlib.Path('predictive/model-heart-disease-v1.json')
          m=json.loads(p.read_text())
          assert m['schema']=='healthsolver.predictive_model.v1'
          assert m['model_id']=='HS-UCI-HD-001'
          assert len(m['features'])==13
          q=m['metrics_test']
          assert 0.5 <= q['auroc'] <= 1
          assert 0 <= q['brier'] <= 1
          assert q['n_test']>0
          x={f:m['imputation']['values'][f] for f in m['features']}
          score=m['logistic']['intercept']
          for f in m['features']:
              z=(x[f]-m['standardization']['mean'][f])/m['standardization']['scale'][f]
              score += z*m['logistic']['coefficients'][f]
          z=m['calibration']['intercept']+m['calibration']['slope']*score
          prob=1/(1+math.exp(-z))
          assert math.isfinite(prob) and 0 < prob < 1
          print({'model':m['model_id'],'probability_at_training_medians':prob,'metrics':q})
          PY
