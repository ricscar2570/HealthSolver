name: HealthSolver 0.47 Archive Diagnostic
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs047-archive-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Diagnose archive exports
        shell: bash
        run: |
          cat > diag.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({acceptDownloads:true,viewport:{width:1400,height:1400}});
          const downloads=[]; const errors=[];
          page.on('download',d=>downloads.push({name:d.suggestedFilename(),url:d.url()}));
          page.on('pageerror',e=>errors.push('PAGE '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
          await page.goto('https://ricscar2570.github.io/HealthSolver/?audit=archive-diagnostic',{waitUntil:'networkidle',timeout:120000});
          await page.waitForFunction(()=>document.body.innerText.includes('Modulo singolo'),{timeout:30000});
          // Create a revision first.
          await page.locator('aside .nav[data-page="case"]').click();
          await page.locator('#loadExample').click();
          const consent=page.locator('#consent');if(await consent.count()===1 && !(await consent.isChecked())) await consent.check();
          await page.locator('#evaluate').click();await page.waitForTimeout(250);
          await page.locator('#reveal').click();await page.locator('#saveCase').click();await page.waitForTimeout(150);
          await page.locator('aside .nav[data-page="archive"]').click();
          console.log('ARCHIVE_BEFORE\n'+await page.locator('#page-archive').innerText());

          for(const id of ['exportBackup','encryptBackup']){
            if(id==='encryptBackup') await page.locator('#password').fill('HealthSolver-Archive-047!');
            const before=downloads.length;
            console.log('CLICK',id,'disabled',await page.locator('#'+id).isDisabled());
            await page.locator('#'+id).click();
            await page.waitForTimeout(1200);
            console.log('AFTER',id,'downloads',downloads.slice(before),'TEXT\n'+(await page.locator('#page-archive').innerText()).slice(0,5000));
          }
          console.log('ERRORS',errors);
          console.log('DOWNLOADS',downloads);
          await page.screenshot({path:'archive-diagnostic.png',fullPage:true});
          await browser.close();
          JS
          node diag.mjs | tee archive-diagnostic.txt
      - uses: actions/upload-artifact@v4
        with:
          name: healthsolver-047-archive-diagnostic
          path: |
            archive-diagnostic.txt
            archive-diagnostic.png
          retention-days: 14
