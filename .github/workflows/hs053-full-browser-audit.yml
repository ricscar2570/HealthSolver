name: HealthSolver 0.53 Compact Full Browser E2E
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs053-full-browser-audit.yml']
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run compact full-app audit
        run: |
          cat > audit.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='https://ricscar2570.github.io/HealthSolver/';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({viewport:{width:1440,height:1800}});
          const err=[];p.on('pageerror',e=>err.push(e.message));p.on('console',m=>{if(m.type()==='error')err.push(m.text())});
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          const nav=async x=>{const n=p.locator('aside .nav[data-page="'+x+'"]');ok(await n.count()===1,'nav '+x);await n.click();await p.waitForTimeout(80);ok(await p.locator('#page-'+x).isVisible(),'page '+x)};
          const set=async(id,v)=>{const q=p.locator('#'+id);ok(await q.count()===1,'missing '+id);await q.evaluate((e,x)=>{e.value=String(x);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}))},v)};
          await p.goto(base+'?audit=053-full',{waitUntil:'networkidle',timeout:120000});
          const meta=await fetch(base+'version.json?audit=053-full').then(r=>r.json());
          ok(meta.version==='0.53.0'&&meta.predictive_model_count===13,'release metadata');
          for(const x of ['coach','intelligence','hub','massive','case','data','validation','archive','previous']) await nav(x);
          console.log('navigation PASS');

          await nav('coach');await p.locator('#coachNewBlank').click();await p.locator('#coachAge').fill('67');await p.locator('#coachContinue').click();console.log('Coach PASS');

          await nav('intelligence');
          await set('ciAge',65);
          const sex=p.locator('#ciSex');
          const os=await sex.locator('option').evaluateAll(a=>a.map(o=>({v:o.value,t:o.textContent.trim()})));
          const male=os.find(o=>/masch|male|^m$/i.test(o.t)||/^(m|male|maschio|1)$/i.test(o.v));ok(male,'male option');await sex.selectOption(male.v);
          await set('ci_pulse',100);await set('ci_creatinine',1.2);await set('ci_sodium',137);
          for(const [id,v] of Object.entries({hs53_dzgroup:'CHF',hs53_numco:2,hs53_scoma:0,hs53_hday:1,hs53_diabetes:0,hs53_dementia:0,hs53_ca:'no',hs53_meanbp:77,hs53_wblc:10.5,hs53_resp:24,hs53_temp:36.7}))await set(id,v);
          ok((await p.locator('#hs-predictive-integrated').innerText()).includes('13 MODELLI SUPERVISIONATI'),'13 badge');
          ok(await p.locator('#hs42Coverage .metric').count()===13,'13 coverage');
          await p.locator('#hs42Run').click();await p.waitForTimeout(350);
          ok(await p.locator('#hs42Results>.card').count()===13,'13 result cards');
          const c=p.locator('#hs42Results>.card').filter({hasText:'HS-SUPPORT2-HOSPDEATH-001'});
          ok(await c.count()===1,'support result');const t=await c.innerText();ok(/%/.test(t)&&!/Astensione/i.test(t),'support numeric result');
          console.log('13-model registry/result surface PASS');

          await nav('hub');await p.locator('#hubExample').click();console.log('Hub PASS');
          await nav('massive');ok((await p.locator('#page-massive').innerText()).includes('Massive Public Data'),'Massive');console.log('Massive Public Data PASS');
          await nav('case');await p.locator('#loadExample').click();console.log('Single model surface PASS');
          await nav('data');ok(await p.locator('#train').count()===1,'train');console.log('Data/training surface PASS');
          await nav('validation');ok(await p.locator('#recompute').count()===1,'validation');console.log('Validation surface PASS');
          await nav('archive');console.log('Archive surface PASS');
          await nav('previous');ok((await p.locator('#page-previous').innerText()).includes('Visita e laboratori conservati'),'previous');console.log('Previous functions PASS');

          const serious=err.filter(x=>!/api\.fda\.gov/i.test(x));console.log('ALL_BROWSER_ERRORS',JSON.stringify(err));ok(serious.length===0,'browser errors');
          await b.close();console.log('FULL ACTIVE-APP E2E PASS');
          JS
          node audit.mjs | tee full-browser-audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healthsolver-053-full-browser-audit
          path: full-browser-audit.txt
          retention-days: 14
