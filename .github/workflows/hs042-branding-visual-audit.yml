name: HealthSolver 0.42 Branding Visual Audit
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs042-branding-visual-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify live 0.42 branding
        shell: bash
        run: |
          cat > audit.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1365,height:900}});
          await page.goto('https://ricscar2570.github.io/HealthSolver/?branding-audit=042',{waitUntil:'networkidle',timeout:120000});
          await page.waitForTimeout(2500);
          const body=await page.locator('body').innerText();
          if(/MASSIVE PUBLIC DATA\s*·\s*0\.38/i.test(body)) throw new Error('stale 0.38 sidebar branding still visible');
          if(/HealthSolver\s+0\.38\.0\s*·\s*Massive Public Data/i.test(body)) throw new Error('stale 0.38 footer branding still visible');
          if(!/INTEGRATED PREDICTIVE UI\s*·\s*0\.42/i.test(body)) throw new Error('0.42 sidebar branding missing');
          if(!/HealthSolver\s+0\.42\.0/i.test(body)) throw new Error('0.42 footer branding missing');
          await page.screenshot({path:'HealthSolver-0.42-Branding-Live.png',fullPage:false});
          console.log(body.slice(0,3000));
          await browser.close();
          JS
          node audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: healthsolver-042-branding-live
          path: HealthSolver-0.42-Branding-Live.png
          retention-days: 7
