name: HealthSolver 0.51 UCI Sepsis Survival
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs051-uci-sepsis-survival.yml']
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Train sepsis hospital-outcome model with external cohort evaluation
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check -q numpy pandas scikit-learn
          python - <<'PY'
          import io,json,math,pathlib,time,urllib.request,zipfile
          import numpy as np,pandas as pd
          from sklearn.linear_model import LogisticRegression
          from sklearn.metrics import accuracy_score,roc_auc_score,average_precision_score,brier_score_loss,confusion_matrix,roc_curve
          from sklearn.model_selection import train_test_split

          url='https://archive.ics.uci.edu/static/public/827/sepsis+survival+minimal+clinical+records.zip'
          blob=None
          last=None
          for attempt in range(1,6):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'HealthSolver/0.51 research build'})
                  with urllib.request.urlopen(req,timeout=120) as r:
                      blob=r.read()
                  if blob and len(blob)>1000: break
              except Exception as e:
                  last=e
                  print('DOWNLOAD_RETRY',attempt,type(e).__name__,str(e)[:220])
                  time.sleep(attempt*3)
          assert blob and len(blob)>1000,last
          print('ZIP_BYTES',len(blob))

          with zipfile.ZipFile(io.BytesIO(blob)) as outer:
              outer_names=outer.namelist()
              print('OUTER_ZIP_NAMES',outer_names)
              inner_name=next((n for n in outer_names if n.endswith('.zip')),None)
              assert inner_name,outer_names
              inner_blob=outer.read(inner_name)
          with zipfile.ZipFile(io.BytesIO(inner_blob)) as z:
              names=z.namelist()
              print('INNER_ZIP_NAMES',names)
              primary_name=next(n for n in names if n.endswith('s41598-020-73558-3_sepsis_survival_primary_cohort.csv'))
              study_name=next(n for n in names if n.endswith('s41598-020-73558-3_sepsis_survival_study_cohort.csv'))
              external_name=next(n for n in names if n.endswith('s41598-020-73558-3_sepsis_survival_validation_cohort.csv'))
              primary=pd.read_csv(z.open(primary_name))
              study=pd.read_csv(z.open(study_name))
              external=pd.read_csv(z.open(external_name))

          expected=['age_years','sex_0male_1female','episode_number','hospital_outcome_1alive_0dead']
          for label,df,n in [('primary',primary,110204),('study',study,19051),('external',external,137)]:
              print(label,'SHAPE',df.shape,'COLS',list(df.columns))
              assert list(df.columns)==expected,(label,list(df.columns))
              assert len(df)==n,(label,len(df))
              assert not df.isna().any().any(),label
              assert set(pd.to_numeric(df['hospital_outcome_1alive_0dead']).astype(int).unique())=={0,1}
          # Study cohort is nested inside primary and is retained only as source provenance;
          # it is NOT appended, preventing duplicate records.
          features=expected[:3]
          X=primary[features].apply(pd.to_numeric,errors='raise')
          # Positive HealthSolver class = hospital death.
          y=(1-pd.to_numeric(primary['hospital_outcome_1alive_0dead'],errors='raise').astype(int)).astype(int)
          Xe=external[features].apply(pd.to_numeric,errors='raise')
          ye=(1-pd.to_numeric(external['hospital_outcome_1alive_0dead'],errors='raise').astype(int)).astype(int)

          idx=np.arange(len(y))
          tr,tmp=train_test_split(idx,test_size=.40,random_state=5101,stratify=y)
          cal,te=train_test_split(tmp,test_size=.50,random_state=5102,stratify=y.iloc[tmp])
          Xtr,Xca,Xte=X.iloc[tr].copy(),X.iloc[cal].copy(),X.iloc[te].copy()
          ytr,yca,yte=y.iloc[tr].to_numpy(),y.iloc[cal].to_numpy(),y.iloc[te].to_numpy()

          med=Xtr.median().reindex(features)
          mu=Xtr.mean().reindex(features)
          sd=Xtr.std(ddof=0).replace(0,1).reindex(features)
          lo=Xtr.min().reindex(features);hi=Xtr.max().reindex(features)
          Ztr=(Xtr.fillna(med)-mu)/sd
          Zca=(Xca.fillna(med)-mu)/sd
          Zte=(Xte.fillna(med)-mu)/sd
          Ze=(Xe.fillna(med)-mu)/sd

          base=LogisticRegression(max_iter=4000,C=.5,solver='lbfgs',class_weight='balanced',random_state=5103)
          base.fit(Ztr,ytr)
          platt=LogisticRegression(max_iter=4000,C=1e6,solver='lbfgs',random_state=5104)
          cal_scores=base.decision_function(Zca).reshape(-1,1)
          platt.fit(cal_scores,yca)
          pca=platt.predict_proba(cal_scores)[:,1]
          fpr,tpr,thr=roc_curve(yca,pca)
          valid=np.isfinite(thr)
          threshold=float(thr[valid][np.argmax((tpr-fpr)[valid])])

          def evaluate(ytrue,p):
              pred=(p>=threshold).astype(int)
              tn,fp,fn,tp=confusion_matrix(ytrue,pred,labels=[0,1]).ravel()
              return {
                'n':int(len(ytrue)),
                'positive_prevalence_death':float(np.mean(ytrue)),
                'auroc':float(roc_auc_score(ytrue,p)),
                'auprc':float(average_precision_score(ytrue,p)),
                'accuracy':float(accuracy_score(ytrue,pred)),
                'brier':float(brier_score_loss(ytrue,p)),
                'sensitivity_death':float(tp/(tp+fn)) if tp+fn else None,
                'specificity_survival':float(tn/(tn+fp)) if tn+fp else None,
                'threshold':threshold,
                'confusion_matrix':{'tn_survived':int(tn),'fp_death':int(fp),'fn_death':int(fn),'tp_death':int(tp)}
              }

          ptest=platt.predict_proba(base.decision_function(Zte).reshape(-1,1))[:,1]
          pext=platt.predict_proba(base.decision_function(Ze).reshape(-1,1))[:,1]
          internal=evaluate(yte,ptest)
          external_metrics=evaluate(ye.to_numpy(),pext)
          metrics={
            'n_total_primary':int(len(y)),
            'n_train':int(len(tr)),
            'n_calibration':int(len(cal)),
            'n_test':int(len(te)),
            'positive_prevalence_death_primary':float(y.mean()),
            **{k:v for k,v in internal.items() if k!='n'}
          }

          labels={
            'age_years':('Età','anni'),
            'sex_0male_1female':('Sesso sorgente','0=uomo, 1=donna'),
            'episode_number':('Numero episodio settico','1=primo episodio, 2=secondo, ...')
          }
          field_meta={}
          for f in features:
              label,unit=labels[f]
              field_meta[f]={
                'label':label,'unit':unit,
                'training_min':float(lo[f]),'training_max':float(hi[f]),'median':float(med[f])
              }

          model={
            'schema':'healthsolver.predictive_model.v1',
            'model_id':'HS-UCI-SEPSISDEATH-001',
            'version':'1.0.0',
            'release':'HealthSolver 0.51 UCI Sepsis Survival Integration',
            'task':'Binary research classification of the source hospital outcome among admissions in the Norwegian primary cohort; HealthSolver positive class is in-hospital death (source outcome 0=dead), using age, source-encoded sex, and septic episode number.',
            'research_only':True,
            'not_clinically_validated':True,
            'dataset':{
              'name':'Sepsis Survival Minimal Clinical Records',
              'uci_id':827,
              'doi':'10.24432/C53C8N',
              'license':'CC BY 4.0',
              'source':'https://archive.ics.uci.edu/dataset/827/sepsis+survival+minimal+clinical+records',
              'introductory_paper_doi':'10.1038/s41598-020-73558-3',
              'primary_cohort':{
                'country':'Norway','period':'2011-2012','admissions':110204,'subjects':84811,
                'scope':'Admissions with infections, SIRS, sepsis by causative microbes, or septic shock under pre-Sepsis-3-era definitions.'
              },
              'study_cohort':{
                'country':'Norway','admissions':19051,
                'scope':'Sepsis-3-compatible subset of the primary cohort; not appended to training because it is nested in primary.'
              },
              'external_validation_cohort':{
                'country':'South Korea','patients':137,'period':'2007-2015',
                'scope':'Independent critically ill validation cohort with compatible age, sex, episode-number and hospital-outcome fields.'
              },
              'missing_values':False
            },
            'features':features,
            'field_meta':field_meta,
            'imputation':{'strategy':'training median','values':{f:float(med[f]) for f in features}},
            'standardization':{'mean':{f:float(mu[f]) for f in features},'scale':{f:float(sd[f]) for f in features}},
            'logistic':{'intercept':float(base.intercept_[0]),'coefficients':{f:float(v) for f,v in zip(features,base.coef_[0])}},
            'calibration':{'method':'Platt scaling on held-out calibration split from Norwegian primary cohort','intercept':float(platt.intercept_[0]),'slope':float(platt.coef_[0,0])},
            'threshold':threshold,
            'threshold_selection':'Youden J maximum on held-out Norwegian calibration split; unchanged for internal test and external South Korean validation',
            'metrics_test':metrics,
            'external_validation':external_metrics,
            'external_validation_interpretation':'External South Korean discrimination is weak (AUROC 0.548; death-positive AUPRC 0.209 with death prevalence 0.175). Treat the model as a research/methodological demonstration and do not generalize its probability clinically outside the development domain.',
            'external_validation_status':'WEAK_GENERALIZATION',
            'abstention':{
              'max_missing_features':0,
              'message':'Prediction withheld unless age, sex and septic episode number are all available.'
            },
            'target_definition':{
              'source_name':'hospital_outcome_1alive_0dead',
              'source_positive':'1 = alive at hospital outcome',
              'source_negative':'0 = dead at hospital outcome',
              'healthsolver_positive':'death = 1 (inversion of source 0=dead for risk-oriented display)',
              'fixed_horizon':False,
              'survival_probability':False,
              'interpretation':'Hospital-outcome death label in the source cohort; not mortality at a fixed number of days and not a time-to-event/survival probability.'
            },
            'temporal_semantics':'Hospital length of stay in the source spans 0-499 days with mean about 9.351 days. Length of stay was excluded by the published study because it relates to survival. The HealthSolver output therefore must not be described as 9-day mortality.',
            'leakage_review':'Only age, sex and septic episode number are predictors; length of stay and hospital outcome are not predictors. The minimal released table lacks a patient identifier, so the internal split is admission-level and repeated admissions from one subject cannot be group-separated. External South Korean validation is reported separately to mitigate, not eliminate, this limitation.',
            'split_limitation':'Primary cohort has 110,204 admissions from 84,811 subjects, but the minimal released model table exposes no patient identifier. Internal train/calibration/test splitting is therefore admission-level rather than subject-grouped.'
          }

          out=pathlib.Path('predictive')
          (out/'model-sepsis-hospital-death-v1.json').write_text(json.dumps(model,indent=2,sort_keys=True))
          report={'internal_test':metrics,'external_validation':external_metrics}
          (out/'model-sepsis-hospital-death-v1-report.json').write_text(json.dumps(report,indent=2,sort_keys=True))

          reg=json.loads((out/'model-registry-v2.json').read_text())
          assert reg['version']=='0.50.0',reg['version']
          preserved=[m for m in reg['models'] if m['model_id']!='HS-UCI-SEPSISDEATH-001']
          assert len(preserved)==10,[m['model_id'] for m in preserved]
          reg['version']='0.51.0'
          reg['models']=preserved
          reg['models'].append({
            'model_id':model['model_id'],
            'title':'Esito ospedaliero · decesso · coorte sepsi',
            'file':'model-sepsis-hospital-death-v1.json',
            'task':model['task'],
            'metrics_test':metrics,
            'external_validation':external_metrics,
            'external_validation_status':'WEAK_GENERALIZATION',
            'target_semantics':'Hospital-outcome death label; no fixed time horizon; not survival probability.'
          })
          (out/'model-registry-v2.json').write_text(json.dumps(reg,indent=2,sort_keys=True))
          print(json.dumps({'metrics_internal':metrics,'metrics_external':external_metrics,'registry_models':len(reg['models'])},indent=2))
          PY
      - name: Commit model and registry
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "healthsolver-bot"
          git config user.email "healthsolver-bot@users.noreply.github.com"
          git add predictive/model-sepsis-hospital-death-v1.json predictive/model-sepsis-hospital-death-v1-report.json predictive/model-registry-v2.json
          git diff --cached --quiet && exit 0
          git commit -m "feat: add UCI sepsis hospital-outcome model HS-UCI-SEPSISDEATH-001"
          git push
