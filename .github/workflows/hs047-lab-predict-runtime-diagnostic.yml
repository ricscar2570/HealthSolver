name: HealthSolver 0.47 Laboratory Predict Runtime Diagnostic
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs047-lab-predict-runtime-diagnostic.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Inspect laboratory prediction runtime
        shell: bash
        run: |
          cat > diag.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1600}});
          const errors=[];
          page.on('pageerror',e=>errors.push('PAGE '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
          await page.goto('https://ricscar2570.github.io/HealthSolver/?audit=lab-predict-runtime',{waitUntil:'networkidle',timeout:120000});
          await page.waitForFunction(()=>document.body.innerText.includes('Visita e laboratori precedenti'),{timeout:30000});
          await page.locator('aside .nav[data-page="previous"]').click();
          const prev=page.frameLocator('#previous');
          await prev.locator('[data-page="lab"]').click(); await page.waitForTimeout(200);
          const lab=prev.frameLocator('#laboratory');
          await lab.locator('body').waitFor({state:'attached',timeout:30000});
          await lab.getByRole('button',{name:/Esplora un caso/i}).first().click(); await page.waitForTimeout(120);
          await lab.locator('#predict').waitFor({state:'visible',timeout:15000});

          const snap=async label=>{
            const x=await lab.locator('#v0').inputValue();
            const info=await lab.locator('#predict').evaluate(b=>({
              disabled:b.disabled,type:b.type,onclick:typeof b.onclick,
              formId:b.form?.id||null,formAction:b.form?.action||null,
              formOnsubmit:b.form?typeof b.form.onsubmit:null,
              outer:b.outerHTML
            }));
            const val=async sel=>await lab.locator(sel).count()?await lab.locator(sel).evaluate(e=>({text:e.innerText,html:e.innerHTML,hidden:e.hidden,cls:e.className})):null;
            console.log(label,JSON.stringify({
              v0:x,predict:info,
              caseType:await val('#caseType'),
              resultTitle:await val('#resultTitle'),
              resultDesc:await val('#resultDesc'),
              bars:await val('#bars'),
              resultWarning:await val('#resultWarning'),
              truth:await val('#truth')
            },null,2));
          };

          await snap('BEFORE');
          const original=Number(await lab.locator('#v0').inputValue());
          await lab.locator('#v0').fill(String(original+0.123));
          await page.waitForTimeout(80);
          await snap('AFTER_INPUT');
          await lab.locator('#predict').click();
          await page.waitForTimeout(500);
          await snap('AFTER_CLICK');
          console.log('ERRORS',JSON.stringify(errors,null,2));
          await browser.close();
          JS
          node diag.mjs | tee lab-predict-runtime.txt
      - uses: actions/upload-artifact@v4
        with:
          name: healthsolver-047-lab-predict-runtime
          path: lab-predict-runtime.txt
          retention-days: 7
