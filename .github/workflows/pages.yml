name: Deploy HealthSolver Clinical Coach
on:
  push:
    branches: ['gh-pages']
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify HealthSolver payload
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,pathlib
          root=pathlib.Path('docs/payload')
          b64=b''.join((root/f'part-{i:02d}.b64').read_bytes().strip() for i in range(5))
          raw=gzip.decompress(base64.b64decode(b64))
          sha=hashlib.sha256(raw).hexdigest()
          expected='b2d83af82efe7998f1ef98bd0ba903fba29d7026ce216dd3ac7e393fda87feb8'
          print('HealthSolver HTML:',len(raw),'bytes',sha)
          assert sha==expected
          assert b'Clinical Coach' in raw
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
