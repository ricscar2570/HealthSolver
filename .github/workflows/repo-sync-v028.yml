name: Repository sync v0.28.0

on:
  push:
    branches:
      - repo-sync-v0.28.0-step2

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check readiness
        id: ready
        shell: bash
        run: |
          if [ -f .repo-sync/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore repository bundle and publish
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat .repo-sync/bundle.slice-* > /tmp/healthsolver.bundle.b64
          base64 --decode /tmp/healthsolver.bundle.b64 > /tmp/healthsolver.bundle
          git bundle verify /tmp/healthsolver.bundle
          rm -rf /tmp/healthsolver-publish
          git clone /tmp/healthsolver.bundle /tmp/healthsolver-publish
          cd /tmp/healthsolver-publish
          test "$(git rev-parse HEAD)" = "5a2ba47433026627165ca180ea3010d44984a630"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin main:main
          git push --force origin refs/tags/v0.27.0-step1:refs/tags/v0.27.0-step1
          git push --force origin refs/tags/v0.28.0-step2:refs/tags/v0.28.0-step2
