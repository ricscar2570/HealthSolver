name: HealthSolver 0.56 Transport Live Browser Audit
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs056-live-browser-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify live 0.56 transport and regression surface
        shell: bash
        run: |
          cat > audit.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='https://ricscar2570.github.io/HealthSolver/';
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          const meta=await fetch(base+'version.json?audit=056').then(r=>r.json());
          ok(meta.version==='0.56.0','version');
          ok(meta.predictive_model_count===14,'base model count');
          ok(meta.ensemble_intelligence_integrated===true,'ensemble flag');
          ok(meta.common_outcome_transport_integrated===true,'transport flag');
          ok(meta.common_outcome_transport_qualification==='WEAK_TRANSPORT_GENERALIZATION','transport qualification');
          const model=await fetch(base+'predictive/common-outcome-transport-v1.json?audit=056').then(r=>r.json());
          ok(model.base_predictive_model_count_preserved===14,'transport base count');
          ok(model.qualification_status==='WEAK_TRANSPORT_GENERALIZATION','artifact qualification');
          ok(model.metrics.minimum_loso_auroc<0.60,'weak transport evidence');

          const b=await chromium.launch({headless:true});
          const p=await b.newPage({viewport:{width:1440,height:2200}});
          const errors=[];
          p.on('pageerror',e=>errors.push(e.message));
          p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          await p.goto(base+'?audit=056',{waitUntil:'networkidle',timeout:120000});
          await p.locator('aside .nav[data-page="intelligence"]').click();
          await p.waitForTimeout(200);
          const root=p.locator('#hs-predictive-integrated');
          const initial=await root.innerText();
          ok(initial.includes('MOTORE PREDITTIVO · HEALTHSOLVER 0.56.0'),'branding');
          ok(initial.includes('14 MODELLI SUPERVISIONATI'),'14 badge');
          ok(initial.includes('1 TRANSPORT LAYER SPERIMENTALE'),'transport badge');
          ok(initial.includes('COMMON-OUTCOME TRANSPORT · 0.56'),'transport section');
          ok(initial.includes('GENERALIZZAZIONE DEBOLE'),'weak warning');

          await p.locator('#ciAge').fill('65');
          const sex=p.locator('#ciSex');
          const opts=await sex.locator('option').evaluateAll(os=>os.map(o=>({v:o.value,t:o.textContent.trim()})));
          const male=opts.find(o=>/masch|male|^m$/i.test(o.t)||/^(m|male|maschio|1)$/i.test(o.v));
          ok(male,'male option');await sex.selectOption(male.v);
          await p.locator('#hs42Run').click();await p.waitForTimeout(400);

          ok(await p.locator('#hs42Results>.card').count()===14,'14 base result cards');
          const transport=await p.locator('#hs56Transport').innerText();
          ok(transport.includes('WEAK_TRANSPORT_GENERALIZATION'),'qualification rendered');
          ok(transport.includes('0.530'),'minimum LOSO rendered');
          ok(/\d+\.\d%/.test(transport),'transport numeric output');
          const state=await p.evaluate(()=>window.__HS_LAST_TRANSPORT__);
          ok(state&&state.status==='predicted','transport state');
          ok(state.qualification==='WEAK_TRANSPORT_GENERALIZATION','state qualification');
          ok(state.minimum_loso_auroc<.60,'state min loso');
          ok((await p.locator('#hs55Ensemble').innerText()).includes('NON È UNA PROBABILITÀ'),'ensemble preserved');

          for(const page of ['coach','hub','massive','case','data','validation','archive','previous']){
            const nav=p.locator('aside .nav[data-page="'+page+'"]');
            ok(await nav.count()===1,'nav '+page);await nav.click();await p.waitForTimeout(50);
            ok(await p.locator('#page-'+page).isVisible(),'page '+page);
          }
          ok(errors.filter(x=>!/api\.fda\.gov/i.test(x)).length===0,'browser errors '+errors.join(' | '));
          await b.close();
          console.log('HS056 LIVE BROWSER PASS',JSON.stringify(state));
          JS
          node audit.mjs | tee audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healthsolver-056-live-browser
          path: audit.txt
          retention-days: 14
