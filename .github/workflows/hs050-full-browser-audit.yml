name: HealthSolver 0.50 Full Browser E2E Audit
# final 0.50 provenance qualification
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs050-full-browser-audit.yml']
permissions:
  contents: read
jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: End-to-end audit active 0.50 browser workflows
        shell: bash
        run: |
          cat > audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const base='https://ricscar2570.github.io/HealthSolver/';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1900},acceptDownloads:true});
          const errors=[];
          page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
          const must=(v,msg)=>{if(!v)throw new Error(msg)};
          const nav=async p=>{const n=page.locator('aside .nav[data-page="'+p+'"]');must(await n.count()===1,'nav missing '+p);await n.click();await page.waitForTimeout(100);must(await page.locator('#page-'+p).isVisible(),'page not visible '+p);};
          const setValue=async(id,value)=>{const loc=page.locator('#'+id);must(await loc.count()===1,'missing '+id);await loc.evaluate((e,v)=>{e.value=String(v);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));},value);};
          const selectLabel=async(id,label)=>{const loc=page.locator('#'+id);must(await loc.count()===1,'missing '+id);await loc.selectOption({label});};
          const download=async(selector,path)=>{const dp=page.waitForEvent('download',{timeout:15000});await page.locator(selector).click();const d=await dp;await d.saveAs(path);must(fs.existsSync(path)&&fs.statSync(path).size>0,'empty download '+selector);};

          await page.goto(base+'?audit=050-full',{waitUntil:'networkidle',timeout:120000});
          await page.waitForFunction(()=>document.body.innerText.includes('Clinical Coach')&&document.body.innerText.includes('Expert Mode'),{timeout:30000});
          const meta=await fetch(base+'version.json?audit=050-full').then(r=>r.json());
          must(meta.version==='0.50.0','wrong version');
          must(meta.predictive_model_count===10,'wrong model count');
          for(const p of ['coach','intelligence','hub','massive','case','data','validation','archive','previous']) await nav(p);
          console.log('navigation PASS');

          await nav('coach');
          await page.locator('#coachNewBlank').click();
          await page.locator('#coachAge').fill('67');
          await selectLabel('coachSex','Maschile');
          await page.locator('#coachContinue').click();
          await page.waitForTimeout(150);
          must((await page.locator('#page-coach').innerText()).includes('67'),'Coach profile failed');
          console.log('Coach PASS');

          await nav('intelligence');
          await page.locator('#ciClear').click();
          await page.locator('#ciText').fill('Età 64, sesso F, PA 132/78, FC 104, SpO2 93%. Tosse e dispnea. Creatinina 1.4 mg/dL.');
          await page.locator('#ciExtract').click();await page.waitForTimeout(120);await page.locator('#ciApply').click();await page.waitForTimeout(120);
          must((await page.locator('#ciAge').inputValue())==='64','Expert age parse failed');
          must((await page.locator('#ci_systolic').inputValue())==='132','Expert SBP parse failed');
          if(!(await page.locator('#ciConsent').isChecked()))await page.locator('#ciConsent').check();
          await page.locator('#ciRun').click();await page.waitForTimeout(250);
          console.log('Expert extraction/analysis PASS');

          const cdcDetails=page.locator('#hs50CdcDiabetesDetails');
          await cdcDetails.evaluate(el=>{el.open=true});
          const cdcText=await cdcDetails.innerText();
          must(cdcText.includes('253.680'),'CDC source size missing');
          must(cdcText.includes('prediabete e diabete'),'CDC target semantics missing');
          must(cdcText.includes('non è la probabilità futura di sviluppare diabete'),'CDC future-risk warning missing');

          await setValue('ciAge',55);await selectLabel('ciSex','Maschile');
          for(const [id,v] of Object.entries({ci_systolic:130,ci_total_chol:220,ci_fasting_glucose:100,ci_max_heart_rate:150,ci_oldpeak:1,ci_major_vessels:0}))await setValue(id,v);
          await setValue('ci_exercise_angina',0);
          for(const [id,v] of Object.entries({hs42_cp:2,hs42_restecg:0,hs42_slope:1,hs42_thal:3}))await setValue(id,v);
          for(const [id,v] of Object.entries({ci_bp:80,ci_specific_gravity:1.02,ci_urine_albumin:0,ci_urine_sugar:0,ci_random_glucose:110,ci_blood_urea:30,ci_creatinine:1,ci_sodium:140,ci_potassium:4.2,ci_hemoglobin:14,ci_pcv:42,ci_wbc_count:7500,ci_rbc_count:5}))await setValue(id,v);
          for(const [id,v] of Object.entries({hs42_radius1:14,hs42_texture1:19,hs42_perimeter1:90,hs42_area1:600,hs42_smoothness1:.095,hs42_compactness1:.1,hs42_concavity1:.08,hs42_concave_points1:.05,hs42_symmetry1:.18,hs42_fractal_dimension1:.06}))await setValue(id,v);
          for(const [id,v] of Object.entries({hs44_alb:42,hs44_alp:66,hs44_alt:23,hs44_ast:26,hs44_bil:7,hs44_che:8.4,hs44_chol:5.4,hs44_crea:77,hs44_ggt:23,hs44_prot:72}))await setValue(id,v);
          for(const [id,v] of Object.entries({hs45_bmi:28,hs45_waist:99,hs45_sbp:124,hs45_tc:185,hs45_hdl:51,hs46_current_smoker:0,hs46_fair_poor_health:0}))await setValue(id,v);
          for(const [id,v] of Object.entries({hs47_time_in_hospital:7,hs47_num_lab_procedures:55,hs47_num_procedures:2,hs47_num_medications:18,hs47_number_outpatient:1,hs47_number_emergency:1,hs47_number_inpatient:2,hs47_number_diagnoses:9,hs47_a1c_abnormal:1,hs47_glucose_abnormal:1,hs47_diabetes_med:1,hs47_medication_change:1}))await setValue(id,v);
          for(const [id,v] of Object.entries({hs48_smoking:'No',hs48_hx_smoking:'No',hs48_hx_radiothreapy:'No',hs48_thyroid_function:'Euthyroid',hs48_physical_examination:'Normal',hs48_adenopathy:'No',hs48_pathology:'Papillary',hs48_focality:'Uni-Focal',hs48_risk:'Low',hs48_t:'T1a',hs48_n:'N0',hs48_m:'M0',hs48_stage:'I'}))await setValue(id,v);
          for(const [id,v] of Object.entries({hs49_anaemia:0,hs49_cpk:250,hs49_diabetes:1,hs49_ejection_fraction:35,hs49_high_blood_pressure:1,hs49_platelets:250000,hs49_serum_creatinine:1.4,hs49_serum_sodium:137,hs49_smoking:0}))await setValue(id,v);
          for(const [id,v] of Object.entries({hs50_high_bp:1,hs50_high_chol:1,hs50_chol_check:1,hs50_smoker_100:1,hs50_stroke_history:0,hs50_heart_disease_or_attack:0,hs50_physical_activity:1,hs50_fruits_daily:1,hs50_veggies_daily:1,hs50_heavy_alcohol:0,hs50_any_healthcare:1,hs50_no_doctor_due_cost:0,hs50_general_health:3,hs50_mental_health_days:2,hs50_physical_health_days:4,hs50_difficulty_walking:0,hs50_education:5,hs50_income:7}))await setValue(id,v);
          await page.locator('#hs42Run').click();await page.waitForTimeout(400);
          const cards=page.locator('#hs42Results>.card');
          must(await cards.count()===10,'expected 10 prediction cards');
          for(let i=0;i<10;i++){const t=await cards.nth(i).innerText();must(/%/.test(t),'missing probability card '+i);must(!/Astensione/i.test(t),'unexpected abstention '+i);}
          const cdcCard=page.locator('#hs42Results>.card').filter({hasText:'HS-CDC-DIABIND-001'});
          const cdcResult=await cdcCard.innerText();
          must(cdcResult.includes('non diagnosi né rischio futuro'),'CDC semantic result warning missing');
          console.log('10-model integrated prediction PASS');

          await nav('hub');
          await page.locator('#hubExample').click();await page.waitForTimeout(120);
          if(!(await page.locator('#hubConsent').isChecked()))await page.locator('#hubConsent').check();
          await page.locator('#hubAnalyze').click();await page.waitForTimeout(250);
          console.log('Hub PASS');

          await nav('massive');
          await page.locator('#mpAge').fill('64');await page.locator('#mpBmi').fill('34.1');await selectLabel('mpSex','Femminile');
          await page.locator('#mpBrfssRun').click();await page.waitForTimeout(180);
          const massiveText=await page.locator('#page-massive').innerText();
          must(massiveText.includes('457.670')&&massiveText.includes('%'),'BRFSS evidence failed');
          fs.writeFileSync('/tmp/fhir.json',JSON.stringify({resourceType:'Bundle',type:'collection',entry:[{resource:{resourceType:'Patient',id:'audit',gender:'female',birthDate:'1980-01-01'}}]}));
          await page.locator('#mpFhirFile').setInputFiles('/tmp/fhir.json');await page.waitForTimeout(250);
          console.log('Massive Public Data PASS');

          await nav('case');
          await page.locator('#loadExample').click();
          const consent=page.locator('#consent');if(await consent.count()===1&&!(await consent.isChecked()))await consent.check();
          await page.locator('#evaluate').click();await page.waitForTimeout(250);
          must(/probabil|risultat|modello/i.test(await page.locator('#page-case').innerText()),'single model output missing');
          console.log('Single model PASS');

          await nav('data');
          await download('#downloadDataset','/tmp/dataset.json');
          await download('#downloadSchema','/tmp/schema.json');
          await page.locator('#epochs').selectOption('20');
          await page.locator('#train').click();
          await page.waitForFunction(()=>{const b=document.querySelector('#train');return b&&!b.disabled},{timeout:60000});
          console.log('Data/training PASS');

          await nav('validation');
          await page.locator('#recompute').click();await page.waitForTimeout(180);
          must(/AUC|BRIER|sensibil/i.test(await page.locator('#page-validation').innerText()),'validation metrics missing');
          await download('#exportMetrics','/tmp/metrics.json');
          console.log('Validation PASS');

          await nav('archive');
          must(await page.locator('#page-archive').isVisible(),'archive page missing');
          console.log('Archive surface PASS');
          await nav('previous');
          must((await page.locator('#page-previous').innerText()).includes('Visita e laboratori conservati'),'previous marker missing');
          console.log('Previous functions PASS');

          const serious=errors.filter(e=>!/Failed to load resource.*api\.fda\.gov/i.test(e));
          console.log('ALL_BROWSER_ERRORS',JSON.stringify(errors,null,2));
          must(serious.length===0,'browser errors '+serious.join(' | '));
          await page.screenshot({path:'HealthSolver-0.50-Full-Audit.png',fullPage:true});
          await browser.close();
          console.log('FULL ACTIVE-APP E2E PASS');
          JS
          node audit.mjs | tee full-browser-audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healthsolver-050-full-browser-audit
          path: |
            full-browser-audit.txt
            HealthSolver-0.50-Full-Audit.png
          retention-days: 14
