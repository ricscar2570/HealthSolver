name: HealthSolver 0.53 SUPPORT2 Profile
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs053-support2-profile.yml']
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Profile SUPPORT2 after split-first protocol
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check -q numpy==2.5.3 pandas==3.0.6 scikit-learn==1.9.1
          python - <<'PY'
          import io,json,urllib.request,zipfile
          import numpy as np,pandas as pd
          from sklearn.model_selection import train_test_split

          url='https://hbiostat.org/data/repo/support2csv.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'HealthSolver/0.53 research build'})
          with urllib.request.urlopen(req,timeout=120) as r: blob=r.read()
          print('ZIP_BYTES',len(blob))
          assert len(blob)>1000
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              print('ZIP_NAMES',z.namelist())
              csvs=[n for n in z.namelist() if n.lower().endswith('.csv')]
              assert csvs,csvs
              df=pd.read_csv(z.open(csvs[0]))
          print('SHAPE',df.shape)
          print('COLUMNS',list(df.columns))
          assert len(df)==9105
          assert 'hospdead' in df.columns
          y=pd.to_numeric(df['hospdead'],errors='raise').astype(int)
          assert set(y.unique())=={0,1}
          print('HOSPDEAD_COUNTS',y.value_counts().sort_index().to_dict())
          print('HOSPDEAD_PREVALENCE',float(y.mean()))

          # Split before any data-driven screening.
          idx=np.arange(len(df))
          tr,tmp=train_test_split(idx,test_size=.40,random_state=5301,stratify=y)
          cal,te=train_test_split(tmp,test_size=.50,random_state=5302,stratify=y.iloc[tmp])
          print('SPLIT',(len(tr),len(cal),len(te)))
          train=df.iloc[tr].copy()

          excluded={
            'id','hospdead','death','slos','d.time',
            'charges','totcst','totmcst','avtisst','sfdm2',
            'sps','aps','surv2m','surv6m','prg2m','prg6m','dnr','dnrday'
          }
          allowed=[c for c in df.columns if c not in excluded]
          print('ALLOWED_COUNT',len(allowed))
          print('ALLOWED',allowed)

          prof=[]
          for c in allowed:
              z=train[c]
              prof.append({
                'name':c,
                'dtype':str(z.dtype),
                'missing_n_train':int(z.isna().sum()),
                'missing_pct_train':float(z.isna().mean()*100),
                'unique_train':int(z.nunique(dropna=True)),
                'examples':[str(x) for x in z.dropna().astype(str).unique()[:12]]
              })
          print('TRAIN_PROFILE')
          print(json.dumps(prof,indent=2))
          PY
