name: HealthSolver 0.40 Multi-Outcome Predictive Engine
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs040-multioutcome.yml']
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Train CKD and breast malignancy models and build registry
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check -q numpy pandas scikit-learn ucimlrepo
          mkdir -p predictive
          python - <<'PY'
          import json, pathlib
          import numpy as np, pandas as pd
          from ucimlrepo import fetch_ucirepo
          from sklearn.linear_model import LogisticRegression
          from sklearn.metrics import accuracy_score, roc_auc_score, average_precision_score, brier_score_loss, confusion_matrix
          from sklearn.model_selection import train_test_split

          OUT=pathlib.Path('predictive')

          def train_export(*, model_id, version, release, dataset_id, dataset_name, doi, task, features, label_fn, field_meta, filename, seed):
              ds=fetch_ucirepo(id=dataset_id)
              X=ds.data.features.copy()
              yraw=ds.data.targets.iloc[:,0].copy()
              missing=[c for c in features if c not in X.columns]
              if missing: raise SystemExit(f'{model_id}: missing expected features {missing}; got {list(X.columns)}')
              X=X[features].apply(pd.to_numeric,errors='coerce')
              y=label_fn(yraw)
              keep=y.notna()
              X=X.loc[keep].reset_index(drop=True)
              y=y.loc[keep].astype(int).reset_index(drop=True)
              idx=np.arange(len(y))
              train_idx,temp_idx=train_test_split(idx,test_size=0.40,random_state=seed,stratify=y)
              cal_idx,test_idx=train_test_split(temp_idx,test_size=0.50,random_state=seed+1,stratify=y.iloc[temp_idx])
              Xtr=X.iloc[train_idx].copy(); Xcal=X.iloc[cal_idx].copy(); Xte=X.iloc[test_idx].copy()
              ytr=y.iloc[train_idx].to_numpy(); ycal=y.iloc[cal_idx].to_numpy(); yte=y.iloc[test_idx].to_numpy()
              med=Xtr.median(numeric_only=True).reindex(features)
              Xtr=Xtr.fillna(med); Xcal=Xcal.fillna(med); Xte=Xte.fillna(med)
              mu=Xtr.mean().reindex(features)
              sd=Xtr.std(ddof=0).replace(0,1).reindex(features)
              lo=Xtr.min().reindex(features); hi=Xtr.max().reindex(features)
              Ztr=(Xtr-mu)/sd; Zcal=(Xcal-mu)/sd; Zte=(Xte-mu)/sd
              base=LogisticRegression(max_iter=5000,C=1.0,solver='lbfgs',random_state=seed+2)
              base.fit(Ztr,ytr)
              platt=LogisticRegression(max_iter=5000,C=1e6,solver='lbfgs',random_state=seed+3)
              platt.fit(base.decision_function(Zcal).reshape(-1,1),ycal)
              p=platt.predict_proba(base.decision_function(Zte).reshape(-1,1))[:,1]
              pred=(p>=0.5).astype(int)
              tn,fp,fn,tp=confusion_matrix(yte,pred,labels=[0,1]).ravel()
              metrics={
                'n_total':int(len(y)),'n_train':int(len(train_idx)),'n_calibration':int(len(cal_idx)),'n_test':int(len(test_idx)),
                'prevalence_total':float(y.mean()),'auroc':float(roc_auc_score(yte,p)),'auprc':float(average_precision_score(yte,p)),
                'accuracy':float(accuracy_score(yte,pred)),'brier':float(brier_score_loss(yte,p)),
                'sensitivity':float(tp/(tp+fn)) if tp+fn else None,'specificity':float(tn/(tn+fp)) if tn+fp else None,
                'confusion_matrix':{'tn':int(tn),'fp':int(fp),'fn':int(fn),'tp':int(tp)}
              }
              fm={}
              for f in features:
                  meta=dict(field_meta.get(f,{}))
                  meta.setdefault('label',f)
                  meta['training_min']=float(lo[f]); meta['training_max']=float(hi[f]); meta['median']=float(med[f])
                  fm[f]=meta
              payload={
                'schema':'healthsolver.predictive_model.v1','model_id':model_id,'version':version,'release':release,
                'task':task,'research_only':True,'not_clinically_validated':True,
                'dataset':{'name':dataset_name,'uci_id':dataset_id,'doi':doi,'license':'CC BY 4.0','source':f'https://archive.ics.uci.edu/dataset/{dataset_id}'},
                'features':features,'field_meta':fm,
                'imputation':{'strategy':'training median','values':{c:float(med[c]) for c in features}},
                'standardization':{'mean':{c:float(mu[c]) for c in features},'scale':{c:float(sd[c]) for c in features}},
                'logistic':{'intercept':float(base.intercept_[0]),'coefficients':{c:float(v) for c,v in zip(features,base.coef_[0])}},
                'calibration':{'method':'Platt scaling on held-out calibration split','intercept':float(platt.intercept_[0]),'slope':float(platt.coef_[0,0])},
                'threshold':0.5,'metrics_test':metrics,
                'abstention':{'max_missing_features':max(2,int(round(len(features)*0.20))),
                              'message':'Prediction withheld when too many required features are missing.'}
              }
              (OUT/filename).write_text(json.dumps(payload,indent=2,sort_keys=True))
              return payload

          def ckd_label(s):
              q=s.astype(str).str.strip().str.lower()
              return q.map({'ckd':1,'notckd':0,'not ckd':0})

          ckd_features=['age','bp','sg','al','su','bgr','bu','sc','sod','pot','hemo','pcv','wbcc','rbcc']
          ckd_meta={
            'age':{'label':'Età','unit':'anni'},'bp':{'label':'Pressione arteriosa','unit':'mmHg'},
            'sg':{'label':'Peso specifico urine'},'al':{'label':'Albumina urinaria (classe)'},'su':{'label':'Zucchero urinario (classe)'},
            'bgr':{'label':'Glicemia random','unit':'mg/dL'},'bu':{'label':'Urea ematica','unit':'mg/dL'},
            'sc':{'label':'Creatinina sierica','unit':'mg/dL'},'sod':{'label':'Sodio','unit':'mEq/L'},'pot':{'label':'Potassio','unit':'mEq/L'},
            'hemo':{'label':'Emoglobina','unit':'g/dL'},'pcv':{'label':'Ematocrito / PCV'},
            'wbcc':{'label':'Leucociti','unit':'cellule/cumm'},'rbcc':{'label':'Eritrociti','unit':'milioni/cmm'}
          }
          ckd=train_export(model_id='HS-UCI-CKD-001',version='1.0.0',release='HealthSolver 0.40 Multi-Outcome Predictive Engine',
             dataset_id=336,dataset_name='UCI Chronic Kidney Disease',doi='10.24432/C5G020',
             task='Binary research prediction of CKD versus not-CKD within the UCI CKD dataset feature domain.',
             features=ckd_features,label_fn=ckd_label,field_meta=ckd_meta,filename='model-ckd-v1.json',seed=4001)

          def bc_label(s):
              q=s.astype(str).str.strip().str.upper()
              return q.map({'M':1,'B':0})

          bc_features=['radius1','texture1','perimeter1','area1','smoothness1','compactness1','concavity1','concave_points1','symmetry1','fractal_dimension1']
          labels={'radius1':'Raggio medio','texture1':'Texture media','perimeter1':'Perimetro medio','area1':'Area media',
                  'smoothness1':'Smoothness media','compactness1':'Compactness media','concavity1':'Concavità media',
                  'concave_points1':'Punti concavi medi','symmetry1':'Simmetria media','fractal_dimension1':'Dimensione frattale media'}
          bc_meta={f:{'label':labels[f]} for f in bc_features}
          bc=train_export(model_id='HS-UCI-BC-001',version='1.0.0',release='HealthSolver 0.40 Multi-Outcome Predictive Engine',
             dataset_id=17,dataset_name='UCI Breast Cancer Wisconsin (Diagnostic)',doi='10.24432/C5DW2B',
             task='Binary research prediction of malignant versus benign FNA-derived breast-mass feature pattern within the UCI WDBC domain.',
             features=bc_features,label_fn=bc_label,field_meta=bc_meta,filename='model-breast-cancer-v1.json',seed=4011)

          heart=json.loads((OUT/'model-heart-disease-v1.json').read_text())
          registry={
            'schema':'healthsolver.predictive_registry.v2','version':'0.40.0',
            'models':[
              {'model_id':heart['model_id'],'title':'Cardiopatia angiografica','file':'model-heart-disease-v1.json','task':heart['task'],'metrics_test':heart['metrics_test']},
              {'model_id':ckd['model_id'],'title':'Malattia renale cronica','file':'model-ckd-v1.json','task':ckd['task'],'metrics_test':ckd['metrics_test']},
              {'model_id':bc['model_id'],'title':'Malignità su caratteristiche FNA','file':'model-breast-cancer-v1.json','task':bc['task'],'metrics_test':bc['metrics_test']}
            ]
          }
          (OUT/'model-registry-v2.json').write_text(json.dumps(registry,indent=2,sort_keys=True))
          print(json.dumps(registry,indent=2))
          PY
      - name: Commit multi-outcome model artifacts
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "healthsolver-bot"
          git config user.email "healthsolver-bot@users.noreply.github.com"
          git add predictive/model-ckd-v1.json predictive/model-breast-cancer-v1.json predictive/model-registry-v2.json
          git diff --cached --quiet && exit 0
          git commit -m "feat: add HealthSolver 0.40 multi-outcome models"
          git push
