name: HealthSolver 0.53 SUPPORT2 Hospital Death
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs053-support2-hospdead.yml']
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Train SUPPORT2 day-3 hospital-death classifier
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check -q numpy==2.5.3 pandas==3.0.6 scikit-learn==1.9.1
          python - <<'PY'
          import io,json,math,pathlib,urllib.request,zipfile
          import numpy as np,pandas as pd
          from sklearn.linear_model import LogisticRegression
          from sklearn.metrics import accuracy_score,roc_auc_score,average_precision_score,brier_score_loss,confusion_matrix,roc_curve
          from sklearn.model_selection import train_test_split

          url='https://hbiostat.org/data/repo/support2csv.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'HealthSolver/0.53 research build'})
          with urllib.request.urlopen(req,timeout=120) as r: blob=r.read()
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              df=pd.read_csv(z.open('support2.csv'))
          assert df.shape==(9105,47),df.shape
          y=pd.to_numeric(df['hospdead'],errors='raise').astype(int)
          assert y.value_counts().sort_index().to_dict()=={0:6745,1:2360}

          idx=np.arange(len(df))
          tr,tmp=train_test_split(idx,test_size=.40,random_state=5301,stratify=y)
          cal,te=train_test_split(tmp,test_size=.50,random_state=5302,stratify=y.iloc[tmp])
          assert (len(tr),len(cal),len(te))==(5463,1821,1821)

          raw_features=['age','sex','dzgroup','num.co','scoma','hday','diabetes','dementia','ca',
                        'meanbp','wblc','hrt','resp','temp','crea','sod']
          categorical={'sex':['female','male'],
                       'dzgroup':['ARF/MOSF w/Sepsis','COPD','CHF','Cirrhosis','Coma','Colon Cancer','Lung Cancer','MOSF w/Malig'],
                       'ca':['no','yes','metastatic']}
          numeric=[f for f in raw_features if f not in categorical]

          excluded=['id','death','slos','d.time','charges','totcst','totmcst','avtisst','sfdm2',
                    'sps','aps','surv2m','surv6m','prg2m','prg6m','dnr','dnrday',
                    'race','edu','income','dzclass','pafi','alb','bili','ph','glucose','bun','urine','adlp','adls','adlsc']
          assert not set(raw_features)&set(excluded)

          train=df.iloc[tr].copy(); calib=df.iloc[cal].copy(); test=df.iloc[te].copy()
          for c in numeric:
              train[c]=pd.to_numeric(train[c],errors='coerce')
              calib[c]=pd.to_numeric(calib[c],errors='coerce')
              test[c]=pd.to_numeric(test[c],errors='coerce')
          miss=train[numeric].isna().mean()
          assert float(miss.max())<0.05,miss.sort_values(ascending=False).head()

          med=train[numeric].median()
          train[numeric]=train[numeric].fillna(med)
          calib[numeric]=calib[numeric].fillna(med)
          test[numeric]=test[numeric].fillna(med)

          def encode(frame):
              out=pd.DataFrame(index=frame.index)
              for f in numeric: out[f]=pd.to_numeric(frame[f],errors='raise')
              out['sex_male']=(frame['sex'].astype(str)=='male').astype(float)
              for cat in categorical['dzgroup']:
                  out['dzgroup__'+cat]=(frame['dzgroup'].astype(str)==cat).astype(float)
              for cat in categorical['ca']:
                  out['ca__'+cat]=(frame['ca'].astype(str)==cat).astype(float)
              return out

          Xtr=encode(train);Xca=encode(calib);Xte=encode(test)
          features=list(Xtr.columns)
          assert len(features)==25,features
          mu=Xtr.mean();sd=Xtr.std(ddof=0).replace(0,1)
          lo=Xtr.min();hi=Xtr.max()
          Ztr=(Xtr-mu)/sd;Zca=(Xca-mu)/sd;Zte=(Xte-mu)/sd

          ytr=y.iloc[tr].to_numpy();yca=y.iloc[cal].to_numpy();yte=y.iloc[te].to_numpy()
          base=LogisticRegression(max_iter=5000,C=.5,solver='lbfgs',class_weight='balanced',random_state=5303)
          base.fit(Ztr,ytr)
          platt=LogisticRegression(max_iter=5000,C=1e6,solver='lbfgs',random_state=5304)
          cs=base.decision_function(Zca).reshape(-1,1)
          platt.fit(cs,yca)
          pca=platt.predict_proba(cs)[:,1]
          fpr,tpr,thr=roc_curve(yca,pca)
          valid=np.isfinite(thr)
          threshold=float(thr[valid][np.argmax((tpr-fpr)[valid])])

          p=platt.predict_proba(base.decision_function(Zte).reshape(-1,1))[:,1]
          pred=(p>=threshold).astype(int)
          tn,fp,fn,tp=confusion_matrix(yte,pred,labels=[0,1]).ravel()
          metrics={
            'n_total':9105,'n_train':5463,'n_calibration':1821,'n_test':1821,
            'positive_prevalence_hospital_death':float(y.mean()),
            'auroc':float(roc_auc_score(yte,p)),
            'auprc':float(average_precision_score(yte,p)),
            'accuracy':float(accuracy_score(yte,pred)),
            'brier':float(brier_score_loss(yte,p)),
            'sensitivity_hospital_death':float(tp/(tp+fn)),
            'specificity_hospital_survival':float(tn/(tn+fp)),
            'threshold':threshold,
            'confusion_matrix':{'tn_survived':int(tn),'fp_death':int(fp),'fn_death':int(fn),'tp_death':int(tp)}
          }

          raw_schema=[
            {'key':'age','label':'Età','kind':'numeric','unit':'anni'},
            {'key':'sex','label':'Sesso','kind':'categorical','categories':['female','male']},
            {'key':'dzgroup','label':'Gruppo diagnostico SUPPORT','kind':'categorical','categories':categorical['dzgroup']},
            {'key':'num.co','label':'Numero comorbidità','kind':'numeric','unit':'conteggio'},
            {'key':'scoma','label':'SUPPORT coma score giorno 3','kind':'numeric','unit':'score'},
            {'key':'hday','label':'Giorno di ricovero all’ingresso nello studio','kind':'numeric','unit':'giorni'},
            {'key':'diabetes','label':'Diabete','kind':'binary','unit':'0=no, 1=sì'},
            {'key':'dementia','label':'Demenza','kind':'binary','unit':'0=no, 1=sì'},
            {'key':'ca','label':'Cancro','kind':'categorical','categories':['no','yes','metastatic']},
            {'key':'meanbp','label':'Pressione arteriosa media giorno 3','kind':'numeric','unit':'mmHg'},
            {'key':'wblc','label':'Leucociti giorno 3','kind':'numeric','unit':'10^3/µL'},
            {'key':'hrt','label':'Frequenza cardiaca giorno 3','kind':'numeric','unit':'bpm'},
            {'key':'resp','label':'Frequenza respiratoria giorno 3','kind':'numeric','unit':'atti/min'},
            {'key':'temp','label':'Temperatura giorno 3','kind':'numeric','unit':'°C'},
            {'key':'crea','label':'Creatinina giorno 3','kind':'numeric','unit':'mg/dL'},
            {'key':'sod','label':'Sodio giorno 3','kind':'numeric','unit':'mEq/L'}
          ]

          encoding_map={}
          for f in numeric: encoding_map[f]={'raw_key':f,'kind':'numeric'}
          encoding_map['sex_male']={'raw_key':'sex','kind':'category','category':'male'}
          for cat in categorical['dzgroup']: encoding_map['dzgroup__'+cat]={'raw_key':'dzgroup','kind':'category','category':cat}
          for cat in categorical['ca']: encoding_map['ca__'+cat]={'raw_key':'ca','kind':'category','category':cat}

          field_meta={}
          for f in features:
              field_meta[f]={
                'training_min':float(lo[f]),'training_max':float(hi[f]),
                'median':float(Xtr[f].median())
              }

          model={
            'schema':'healthsolver.predictive_model.v1',
            'model_id':'HS-SUPPORT2-HOSPDEATH-001',
            'version':'1.0.0',
            'release':'HealthSolver 0.53 SUPPORT2 Hospital Death Integration',
            'task':'Binary research classification of SUPPORT2 hospdead using a predeclared day-3/baseline feature set after split-first protocol.',
            'research_only':True,
            'not_clinically_validated':True,
            'dataset':{
              'name':'SUPPORT2',
              'instances':9105,
              'centers':5,
              'country':'United States',
              'periods':['1989-1991','1992-1994'],
              'source':'https://hbiostat.org/data/',
              'uci_external_record':'https://archive.ics.uci.edu/dataset/880/support2',
              'permission':'Permission granted by Vanderbilt Department of Biostatistics dataset page; cite original SUPPORT paper and acknowledge hbiostat.org data source.',
              'original_paper':'SUPPORT Principal Investigators, JAMA 1995;274:1591-1598',
              'missing_values':True
            },
            'runtime_environment':{'python':'3.13','numpy':'2.5.3','pandas':'3.0.6','scikit_learn':'1.9.1'},
            'raw_feature_schema':raw_schema,
            'raw_features':raw_features,
            'features':features,
            'encoding_map':encoding_map,
            'field_meta':field_meta,
            'excluded_source_fields':excluded,
            'feature_policy':'Split performed before any screening. Feature set chosen from source semantics and training-partition missingness only; no outcome association was used for feature selection. Race, income and education excluded for portability/fairness. Prior prognostic scores, model predictions, physician prognosis, DNR variables, future costs/utilization and post-2-month functional outcome excluded.',
            'imputation':{'strategy':'training median for numeric raw fields before encoding','raw_values':{f:float(med[f]) for f in numeric},'values':{f:float(Xtr[f].median()) for f in features}},
            'standardization':{'mean':{f:float(mu[f]) for f in features},'scale':{f:float(sd[f]) for f in features}},
            'logistic':{'intercept':float(base.intercept_[0]),'coefficients':{f:float(v) for f,v in zip(features,base.coef_[0])}},
            'calibration':{'method':'Platt scaling on held-out calibration split','intercept':float(platt.intercept_[0]),'slope':float(platt.coef_[0,0])},
            'threshold':threshold,
            'threshold_selection':'Youden J maximum on held-out calibration split; evaluated once on untouched held-out test',
            'metrics_test':metrics,
            'abstention':{'max_missing_features':4,'message':'Prediction withheld when more than four encoded/raw clinical inputs are unavailable.'},
            'target_definition':{
              'source_name':'hospdead',
              'negative':'0 = survived hospitalization',
              'positive':'1 = death in hospital',
              'fixed_horizon':False,
              'survival_probability':False,
              'interpretation':'Source in-hospital death label among seriously ill hospitalized SUPPORT patients; not 30-day/90-day mortality and not a general-population mortality probability.'
            },
            'temporal_semantics':'Most physiologic assessments are study-day-3 values. The model is therefore a day-3/baseline hospital-outcome classifier, not an admission-time model. Hospital death has no single fixed follow-up duration in this released table.',
            'leakage_review':'Excludes death, slos, d.time, charges/costs, average TISS days 3-25, sfdm2, SUPPORT/APACHE physiology scores, model survival estimates, physician prognoses, and DNR variables. Day-3 raw physiology is retained because it defines the intended index time.'
          }

          out=pathlib.Path('predictive')
          (out/'model-support2-hospital-death-v1.json').write_text(json.dumps(model,indent=2,sort_keys=True))
          (out/'model-support2-hospital-death-v1-report.json').write_text(json.dumps(metrics,indent=2,sort_keys=True))

          reg=json.loads((out/'model-registry-v2.json').read_text())
          assert reg['version']=='0.52.0',reg['version']
          old=[m for m in reg['models'] if m['model_id']!='HS-SUPPORT2-HOSPDEATH-001']
          assert len(old)==12,[m['model_id'] for m in old]
          reg['version']='0.53.0'
          reg['models']=old+[{
            'model_id':model['model_id'],
            'title':'SUPPORT2 · decesso intraospedaliero · day 3',
            'file':'model-support2-hospital-death-v1.json',
            'task':model['task'],
            'metrics_test':metrics,
            'target_semantics':'hospdead=1, day-3/baseline source-label classifier; no fixed mortality horizon and not clinically validated.'
          }]
          (out/'model-registry-v2.json').write_text(json.dumps(reg,indent=2,sort_keys=True))
          print(json.dumps({'metrics':metrics,'raw_features':raw_features,'encoded_features':features,'registry_models':len(reg['models'])},indent=2))
          PY
      - name: Commit model and registry
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "healthsolver-bot"
          git config user.email "healthsolver-bot@users.noreply.github.com"
          git add predictive/model-support2-hospital-death-v1.json predictive/model-support2-hospital-death-v1-report.json predictive/model-registry-v2.json
          git diff --cached --quiet && exit 0
          git commit -m "feat: add SUPPORT2 hospital-death model HS-SUPPORT2-HOSPDEATH-001"
          git push
