name: HealthSolver 0.55 Full Static Release Audit
on:
  push:
    branches: ['main']
    paths:
      - 'predictive/**'
      - '.github/workflows/hs055-full-static-audit.yml'
      - '.github/workflows/hs041-repack-pages.yml'
      - '.github/workflows/hs-published-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repository and syntax integrity
        shell: bash
        run: |
          set -euxo pipefail
          git fsck --full
          node --check predictive/integrated-predictive-ui.js
          node --check predictive/predictive-engine.js
          node --check predictive/unified-case-router.js
          python - <<'PY'
          import json,pathlib
          for p in pathlib.Path('predictive').glob('*.json'):
              json.loads(p.read_text())
          print('0.55 PARSE PASS')
          PY

      - name: Freeze 0.54.1 predictive numerical artifacts
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import pathlib,subprocess
          baseline='b78f9f3b320647a8713877ec8938a517440d29fb'
          names=subprocess.check_output(['git','ls-tree','-r','--name-only',baseline,'predictive'],text=True).splitlines()
          frozen=[
              n for n in names
              if n.startswith('predictive/')
              and n!='predictive/integrated-predictive-ui.js'
          ]
          assert 'predictive/model-registry-v2.json' in frozen
          assert 'predictive/predictive-engine.js' in frozen
          assert 'predictive/unified-case-router.js' in frozen
          for path in frozen:
              old=subprocess.check_output(['git','show',f'{baseline}:{path}'])
              new=pathlib.Path(path).read_bytes()
              assert old==new,path
          print('0.54.1 PREDICTIVE CORE BYTE FREEZE PASS',len(frozen))
          PY

      - name: Verify ensemble config coverage and boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('predictive')
          reg=json.loads((root/'model-registry-v2.json').read_text())
          e=json.loads((root/'ensemble-intelligence-v1.json').read_text())
          ids=[x['model_id'] for x in reg['models']]
          assert reg['version']=='0.54.1'
          assert len(ids)==14 and len(set(ids))==14
          assert e['version']=='1.0.0'
          assert e['release']=='HealthSolver 0.55.0 Ensemble Intelligence Layer'
          assigned=[m for d in e['domains'] for m in d['models']]
          assert len(assigned)==14 and len(set(assigned))==14
          assert set(assigned)==set(ids)
          assert e['global_probability'] is False
          assert e['clinically_validated'] is False
          assert e['aggregation']['no_cross_model_probability_averaging'] is True
          assert e['aggregation']['no_recalibration'] is True
          assert len(e['concordance_groups'])==1
          print('0.55 ENSEMBLE CONFIG PASS')
          PY

      - name: Verify ensemble threshold-position mathematics
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json,math,pathlib
          root=pathlib.Path('predictive')
          reg=json.loads((root/'model-registry-v2.json').read_text())
          ens=json.loads((root/'ensemble-intelligence-v1.json').read_text())

          def position(p,t):
              if not (math.isfinite(p) and math.isfinite(t) and 0 < t < 1):
                  raise ValueError((p,t))
              x=max(0.0,min(1.0,p))
              return 0.5*(x/t) if x <= t else 0.5+0.5*((x-t)/(1-t))

          thresholds=[]
          for entry in reg['models']:
              model=json.loads((root/entry['file']).read_text())
              assert model['model_id']==entry['model_id'],entry['file']
              t=float(model['threshold'])
              assert math.isfinite(t) and 0 < t < 1,(entry['model_id'],t)
              thresholds.append((entry['model_id'],t))
              pts=[0.0,t/4,t/2,3*t/4,t,(t+1)/2,1.0]
              vals=[position(p,t) for p in pts]
              assert all(math.isfinite(v) and 0 <= v <= 1 for v in vals),(entry['model_id'],vals)
              assert all(a <= b for a,b in zip(vals,vals[1:])),(entry['model_id'],vals)
              assert abs(position(0.0,t)-0.0) < 1e-12
              assert abs(position(t,t)-0.5) < 1e-12
              assert abs(position(1.0,t)-1.0) < 1e-12

          rules=ens['display_rules']
          below=float(rules['domain_below_max'])
          mixed=float(rules['domain_mixed_max'])
          assert 0 <= below < mixed <= 100,(below,mixed)
          for group in ens['concordance_groups']:
              assert 2 <= int(group['min_applicable']) <= len(group['models']),group['id']

          assert len(thresholds)==14
          print('0.55 ENSEMBLE MATHEMATICS PASS',thresholds)
          PY

      - name: Verify packaging invariants
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'HS_INTEGRATED_PREDICTIVE_0550' predictive/integrated-predictive-ui.js
          grep -q '14 MODELLI SUPERVISIONATI' predictive/integrated-predictive-ui.js
          grep -q 'ENSEMBLE INTELLIGENCE · 0.55' predictive/integrated-predictive-ui.js
          grep -q 'window.__HS_ENSEMBLE_CONFIG__' predictive/integrated-predictive-ui.js
          grep -q "ensemble=json.loads((main/'predictive'/'ensemble-intelligence-v1.json').read_text())" .github/workflows/hs041-repack-pages.yml
          grep -q 'window.__HS_ENSEMBLE_CONFIG__' .github/workflows/hs041-repack-pages.yml
          grep -q "v\['version'\]='0.56.1'" .github/workflows/hs041-repack-pages.yml
          grep -q "v\['ensemble_intelligence_integrated'\]=True" .github/workflows/hs041-repack-pages.yml
          grep -q "transport=json.loads((main/'predictive'/'common-outcome-transport-v1.json').read_text())" .github/workflows/hs041-repack-pages.yml
          grep -q 'window.__HS_COMMON_OUTCOME_TRANSPORT__' .github/workflows/hs041-repack-pages.yml
          grep -q "v\['common_outcome_transport_integrated'\]=True" .github/workflows/hs041-repack-pages.yml
          grep -q "expected_release='0.56.1'" .github/workflows/hs-published-smoke.yml
          grep -q "expected_registry='0.54.1'" .github/workflows/hs-published-smoke.yml
          echo '0.55 ENSEMBLE + CURRENT 0.56.1 PACKAGING INVARIANTS PASS'
