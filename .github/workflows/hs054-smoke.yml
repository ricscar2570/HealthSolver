name: HealthSolver 0.54 eICU Demo Smoke
on:
  push:
    branches: ['main']
    paths:
      - 'predictive/**'
      - '.github/workflows/hs054-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: node --check predictive/integrated-predictive-ui.js

      - name: Verify eICU model and registry
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json,math,pathlib
          root=pathlib.Path('predictive')
          reg=json.loads((root/'model-registry-v2.json').read_text())
          assert reg['schema']=='healthsolver.predictive_registry.v2'
          assert reg['version']=='0.54.0'
          assert len(reg['models'])==14
          ids=[e['model_id'] for e in reg['models']]
          assert len(ids)==len(set(ids))
          assert ids[-1]=='HS-EICU-DEMO-HOSPDEATH-001'

          m=json.loads((root/'model-eicu-demo-hospital-death-v1.json').read_text())
          assert m['model_id']=='HS-EICU-DEMO-HOSPDEATH-001'
          assert m['version']=='1.0.0'
          assert m['dataset']['version']=='2.0.1'
          assert m['dataset']['doi']=='10.13026/4mxk-na84'
          assert 'Open Database License' in m['dataset']['license']
          assert m['dataset']['source_unit_stays']==2520
          assert m['dataset']['source_unique_patients']==1841
          assert m['dataset']['development_cohort_rows']==2004
          assert m['dataset']['development_unique_patients']==1713
          assert m['runtime_environment']=={
              'python':'3.13','numpy':'2.5.3','pandas':'3.0.6','scikit_learn':'1.9.1'
          }
          assert m['target_definition']['source_name']=='hospitaldischargestatus'
          assert m['target_definition']['positive']=='Expired'
          assert m['target_definition']['negative']=='Alive'
          assert m['target_definition']['fixed_horizon'] is False
          assert m['target_definition']['survival_probability'] is False
          assert 'first APACHE day' in m['temporal_semantics']
          assert 'StratifiedGroupKFold' in m['split_policy']
          assert 'no feature/outcome association' in m['feature_policy']
          assert m['abstention']['max_missing_raw_features']==2
          assert m['abstention']['required_raw_features']==['age','sex']
          assert len(m['raw_features'])==11
          assert len(m['features'])==12
          for x in [
              'acutephysiologyscore','apachescore','predictedhospitalmortality',
              'actualhospitalmortality','hospitaldischargelocation','hospitalid',
              'unitdischargestatus','urine','wbc','bun','intubated','vent','dialysis'
          ]:
              assert x in m['excluded_source_fields'],x

          q=m['metrics_test']
          assert q['n_total']==2004
          assert q['n_unique_patients']==1713
          assert q['n_train']==1200 and q['n_calibration']==402 and q['n_test']==402
          assert abs(q['positive_prevalence_hospital_death']-(173/2004))<1e-15
          assert q['auroc']>0.82
          assert q['auprc']>0.35
          assert q['brier']<0.071
          assert q['sensitivity_hospital_death']>0.65
          assert q['specificity_hospital_survival']>0.83
          assert 0<m['threshold']<1

          score=float(m['logistic']['intercept'])
          for f in m['features']:
              scale=float(m['standardization']['scale'][f]); assert scale>0
              v=float(m['imputation']['values'][f])
              score+=(v-float(m['standardization']['mean'][f]))/scale*float(m['logistic']['coefficients'][f])
          z=float(m['calibration']['intercept'])+float(m['calibration']['slope'])*score
          p=1/(1+math.exp(-max(-35,min(35,z))))
          assert math.isfinite(p) and 0<p<1
          assert json.loads((root/'model-eicu-demo-hospital-death-v1-report.json').read_text())==q
          e=next(e for e in reg['models'] if e['model_id']==m['model_id'])
          assert e['metrics_test']==q
          print({'median_probability':p,'metrics':q})
          PY

      - name: Verify eICU UI integration
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'HS_INTEGRATED_PREDICTIVE_0540' predictive/integrated-predictive-ui.js
          grep -q '14 MODELLI SUPERVISIONATI' predictive/integrated-predictive-ui.js
          grep -q 'HS-EICU-DEMO-HOSPDEATH-001' predictive/integrated-predictive-ui.js
          grep -q 'hs54EicuDetails' predictive/integrated-predictive-ui.js
          grep -q "gcs_total:num('hs54_gcs_total')" predictive/integrated-predictive-ui.js
          grep -q "heartrate:num('hs54_heartrate')" predictive/integrated-predictive-ui.js
          grep -q "creatinine:num('hs54_creatinine')" predictive/integrated-predictive-ui.js
          if grep -q "heartrate:first(num('ci_pulse')" predictive/integrated-predictive-ui.js; then
            echo 'Generic pulse fallback introduced into eICU'
            exit 1
          fi
          grep -q 'hospitalDischargeStatus' predictive/integrated-predictive-ui.js
          grep -q 'first APACHE day' predictive/integrated-predictive-ui.js
          echo 'EICU 0.54 SMOKE PASS'
