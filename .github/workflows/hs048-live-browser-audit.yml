name: HealthSolver 0.48 Thyroid Recurrence Live Browser Audit
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs048-live-browser-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify live thyroid recurrence integration
        shell: bash
        run: |
          cat > audit.mjs <<'JS'
          import { chromium } from 'playwright';

          const base='https://ricscar2570.github.io/HealthSolver/';
          const meta=await fetch(base+'version.json?audit=048-thyroid').then(r=>r.json());
          if(meta.version!=='0.48.0') throw new Error('wrong published version '+meta.version);
          if(meta.predictive_model_count!==8) throw new Error('wrong published model count '+meta.predictive_model_count);
          if(!meta.predictive_models.includes('HS-UCI-THYREC-001')) throw new Error('thyroid recurrence model missing from metadata');

          const registry=await fetch(base+'predictive/model-registry-v2.json?audit=048-thyroid').then(r=>r.json());
          if(registry.version!=='0.48.0') throw new Error('wrong registry version '+registry.version);
          if(registry.models.length!==8) throw new Error('wrong registry model count');
          if(!registry.models.some(x=>x.model_id==='HS-UCI-THYREC-001')) throw new Error('thyroid recurrence entry missing');

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1800}});
          const errors=[];
          page.on('pageerror',e=>errors.push('PAGE '+e.message));
          page.on('console',m=>{if(m.type()==='error') errors.push('CONSOLE '+m.text())});

          await page.goto(base+'?audit=048-thyroid',{waitUntil:'networkidle',timeout:120000});
          await page.waitForFunction(()=>document.body.innerText.includes('Clinical Coach')&&document.body.innerText.includes('Expert Mode'),{timeout:30000});

          const expert=page.locator('aside .nav[data-page="intelligence"]');
          if(await expert.count()!==1) throw new Error('Expert Mode nav missing');
          await expert.click(); await page.waitForTimeout(500);

          const block=page.locator('#hs-predictive-integrated');
          if(await block.count()!==1 || !(await block.isVisible())) throw new Error('predictive block missing');
          const initial=await block.innerText();
          if(!initial.includes('8 MODELLI SUPERVISIONATI')) throw new Error('eight-model badge missing');
          if(!initial.includes('Recidiva carcinoma tiroideo differenziato')) throw new Error('thyroid recurrence coverage card missing');

          await page.locator('#ciAge').fill('46');
          const sex=page.locator('#ciSex');
          const sexOpts=await sex.locator('option').evaluateAll(os=>os.map(o=>({v:o.value,t:o.textContent.trim()})));
          const female=sexOpts.find(o=>/fem|female|^f$/i.test(o.t)||/^(f|female|femmina|0|2)$/i.test(o.v));
          if(!female) throw new Error('female sex option not found');
          await sex.selectOption(female.v);

          const details=page.locator('#hs48ThyroidDetails');
          if(await details.count()!==1) throw new Error('thyroid specialist panel missing');
          await details.evaluate(el=>{el.open=true});
          if(await page.locator('#hs48_response').count()!==0) throw new Error('post-treatment Response must not be exposed as a predictor');

          const values={
            hs48_smoking:'No',
            hs48_hx_smoking:'No',
            hs48_hx_radiothreapy:'No',
            hs48_thyroid_function:'Euthyroid',
            hs48_physical_examination:'Normal',
            hs48_adenopathy:'No',
            hs48_pathology:'Papillary',
            hs48_focality:'Uni-Focal',
            hs48_risk:'Low',
            hs48_t:'T1a',
            hs48_n:'N0',
            hs48_m:'M0',
            hs48_stage:'I'
          };
          for(const [id,v] of Object.entries(values)){
            const loc=page.locator('#'+id);
            if(await loc.count()!==1) throw new Error('missing thyroid control '+id);
            await loc.selectOption(v);
          }

          await page.locator('#hs42Refresh').click();
          await page.waitForTimeout(120);
          const coverage=page.locator('#hs42Coverage .metric').filter({hasText:'Recidiva carcinoma tiroideo differenziato'});
          if(await coverage.count()!==1) throw new Error('thyroid coverage card missing after input');
          const coverageText=await coverage.innerText();
          if(!/PRONTO ALLA PREDIZIONE/i.test(coverageText)) throw new Error('thyroid model not ready: '+coverageText);

          await page.locator('#hs42Run').click(); await page.waitForTimeout(350);
          const card=page.locator('#hs42Results .card').filter({hasText:'HS-UCI-THYREC-001'});
          if(await card.count()!==1) throw new Error('thyroid recurrence result card missing');
          const text=await card.innerText();
          if(!/%/.test(text)) throw new Error('thyroid recurrence numeric probability missing');
          if(/Astensione/i.test(text)) throw new Error('thyroid recurrence unexpectedly abstained');
          if(!/AUROC\s+0\.906/i.test(text)) throw new Error('thyroid held-out AUROC not shown as expected: '+text);

          const serious=errors.filter(e=>!/Failed to load resource.*api\.fda\.gov/i.test(e));
          if(serious.length) throw new Error('browser errors '+serious.join(' | '));

          await block.scrollIntoViewIfNeeded();
          await block.screenshot({path:'HealthSolver-0.48-Thyroid-Recurrence.png'});
          await page.screenshot({path:'HealthSolver-0.48-Expert-Mode.png',fullPage:true});
          console.log('THYROID_RESULT\n'+text);
          console.log('THYROID_COVERAGE\n'+coverageText);
          await browser.close();
          JS
          node audit.mjs | tee audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: healthsolver-048-thyroid-live
          path: |
            HealthSolver-0.48-Thyroid-Recurrence.png
            HealthSolver-0.48-Expert-Mode.png
            audit.txt
          retention-days: 14
