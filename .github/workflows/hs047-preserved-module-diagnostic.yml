name: HealthSolver 0.47 Preserved Module Diagnostic
# recursive laboratory inventory
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs047-preserved-module-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Inspect preserved previous module
        shell: bash
        run: |
          cat > diag.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1600}});
          const errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          await page.goto('https://ricscar2570.github.io/HealthSolver/?audit=previous-diagnostic',{waitUntil:'networkidle',timeout:120000});
          await page.waitForFunction(()=>document.body.innerText.includes('Visita e laboratori precedenti'),{timeout:30000});
          await page.locator('aside .nav[data-page="previous"]').click();
          const iframe=page.locator('#previous');
          console.log('IFRAME_COUNT',await iframe.count());
          if(await iframe.count()===1){
            const frame=page.frameLocator('#previous');
            await frame.locator('body').waitFor({state:'attached',timeout:30000});
            const body=await frame.locator('body').innerText();
            console.log('BODY\n'+body.slice(0,15000));
            const controls=await frame.locator('button,input,select,textarea,a,summary').evaluateAll(els=>els.map(e=>({tag:e.tagName,id:e.id||'',type:e.type||'',text:(e.innerText||e.value||e.placeholder||'').trim().slice(0,120),dataPage:e.getAttribute('data-page')})));
            console.log('CONTROLS\n'+JSON.stringify(controls,null,2));
            const navs=await frame.locator('[data-page]').evaluateAll(els=>els.map(e=>({tag:e.tagName,id:e.id||'',text:(e.innerText||'').trim(),dataPage:e.getAttribute('data-page')})));
            console.log('INTERNAL_NAVS\n'+JSON.stringify(navs,null,2));
            const labNav=frame.locator('[data-page="lab"]');
            if(await labNav.count()===1){
              await labNav.click();await page.waitForTimeout(250);
              const labOuter=frame.locator('#laboratory');
              console.log('LAB_IFRAME_COUNT',await labOuter.count());
              if(await labOuter.count()===1){
                const lab=frame.frameLocator('#laboratory');
                await lab.locator('body').waitFor({state:'attached',timeout:30000});
                console.log('LAB_BODY\n'+(await lab.locator('body').innerText()).slice(0,16000));
                const labControls=await lab.locator('button,input,select,textarea,a,summary').evaluateAll(els=>els.map(e=>({tag:e.tagName,id:e.id||'',type:e.type||'',text:(e.innerText||e.value||e.placeholder||'').trim().slice(0,140),dataPage:e.getAttribute('data-page')})));
                console.log('LAB_CONTROLS\n'+JSON.stringify(labControls,null,2));
              }
            }
          }else{
            console.log('OUTER\n'+await page.locator('#page-previous').innerText());
          }
          console.log('ERRORS',errors);
          await page.screenshot({path:'preserved-diagnostic.png',fullPage:true});
          await browser.close();
          JS
          node diag.mjs | tee preserved-diagnostic.txt
      - uses: actions/upload-artifact@v4
        with:
          name: healthsolver-047-preserved-diagnostic
          path: |
            preserved-diagnostic.txt
            preserved-diagnostic.png
          retention-days: 14
