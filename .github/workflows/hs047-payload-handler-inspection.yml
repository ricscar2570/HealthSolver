name: HealthSolver 0.47 Payload Handler Inspection
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs047-payload-handler-inspection.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract selected handlers from published payload
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/hs-pages origin/gh-pages
          python - <<'PY'
          import base64,gzip,pathlib,re
          p=pathlib.Path('/tmp/hs-pages/docs/payload')
          b64=''.join(x.read_text().strip() for x in sorted(p.glob('part-*.b64')))
          html=gzip.decompress(base64.b64decode(b64)).decode('utf-8')
          for term in ['coachStartExample','coachNewBlank','coachRestoreFile','coachExportBackup','exportBackup','encryptBackup','restoreFile','clearSession']:
              print('\n===== '+term+' =====')
              for m in list(re.finditer(re.escape(term),html))[:6]:
                  a=max(0,m.start()-1800);b=min(len(html),m.end()+3000)
                  print(html[a:b])
                  print('\n---')
          PY
