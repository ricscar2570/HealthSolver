name: HealthSolver 0.53 SUPPORT2 Live Browser Audit
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs053-live-browser-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify live SUPPORT2 integration
        shell: bash
        run: |
          cat > audit.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='https://ricscar2570.github.io/HealthSolver/';
          const meta=await fetch(base+'version.json?audit=053-support2').then(r=>r.json());
          if(meta.version!=='0.53.0') throw new Error('wrong published version '+meta.version);
          if(meta.predictive_model_count!==13) throw new Error('wrong model count');
          if(!meta.predictive_models.includes('HS-SUPPORT2-HOSPDEATH-001')) throw new Error('SUPPORT2 model missing');
          if(meta.support2_hospital_death_integrated!==true) throw new Error('SUPPORT2 integration flag missing');
          const reg=await fetch(base+'predictive/model-registry-v2.json?audit=053-support2').then(r=>r.json());
          if(reg.version!=='0.53.0'||reg.models.length!==13) throw new Error('wrong registry');
          const model=await fetch(base+'predictive/model-support2-hospital-death-v1.json?audit=053-support2').then(r=>r.json());
          if(model.dataset.instances!==9105||model.dataset.centers!==5) throw new Error('SUPPORT2 provenance mismatch');
          if(model.raw_features.length!==16||model.features.length!==25) throw new Error('SUPPORT2 feature shape mismatch');
          if(model.target_definition.source_name!=='hospdead') throw new Error('wrong target');

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:2200}});
          const errors=[];
          page.on('pageerror',e=>errors.push('PAGE '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
          await page.goto(base+'?audit=053-support2',{waitUntil:'networkidle',timeout:120000});
          await page.waitForFunction(()=>document.body.innerText.includes('Clinical Coach')&&document.body.innerText.includes('Expert Mode'),{timeout:30000});
          await page.locator('aside .nav[data-page="intelligence"]').click();
          await page.waitForTimeout(300);
          const block=page.locator('#hs-predictive-integrated');
          const initial=await block.innerText();
          if(!initial.includes('13 MODELLI SUPERVISIONATI')) throw new Error('thirteen-model badge missing');
          if(!initial.includes('SUPPORT2 · decesso intraospedaliero · day 3')) throw new Error('SUPPORT2 coverage card missing');

          const details=page.locator('#hs53Support2Details');
          if(await details.count()!==1) throw new Error('SUPPORT2 panel missing');
          await details.evaluate(el=>{el.open=true});
          const detail=await details.innerText();
          for(const needle of ['9.105 pazienti critici','hospdead=1','non è una survival probability','punteggi SUPPORT/APACHE','razza, reddito e istruzione non sono usati']){
            if(!detail.includes(needle)) throw new Error('missing SUPPORT2 disclosure '+needle);
          }

          const set=async(id,v)=>{
            const loc=page.locator('#'+id);
            if(await loc.count()!==1) throw new Error('missing control '+id);
            await loc.evaluate((e,val)=>{e.value=String(val);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));},v);
          };
          await set('ciAge',65);
          const sex=page.locator('#ciSex');
          const opts=await sex.locator('option').evaluateAll(os=>os.map(o=>({v:o.value,t:o.textContent.trim()})));
          const male=opts.find(o=>/masch|male|^m$/i.test(o.t)||/^(m|male|maschio|1)$/i.test(o.v));
          if(!male) throw new Error('male option missing');
          await sex.selectOption(male.v);
          await set('ci_pulse',100);
          await set('ci_creatinine',1.2);
          await set('ci_sodium',137);
          const vals={
            hs53_dzgroup:'CHF',hs53_numco:2,hs53_scoma:0,hs53_hday:1,
            hs53_diabetes:0,hs53_dementia:0,hs53_ca:'no',hs53_meanbp:77,
            hs53_wblc:10.5,hs53_resp:24,hs53_temp:36.7
          };
          for(const [id,v] of Object.entries(vals)) await set(id,v);

          await page.locator('#hs42Refresh').click();await page.waitForTimeout(120);
          const cov=page.locator('#hs42Coverage .metric').filter({hasText:'SUPPORT2 · decesso intraospedaliero · day 3'});
          if(await cov.count()!==1) throw new Error('SUPPORT2 coverage missing');
          const covText=await cov.innerText();
          if(!/25\/25/.test(covText)||!/PRONTO ALLA PREDIZIONE/i.test(covText)) throw new Error('SUPPORT2 not ready '+covText);

          await page.locator('#hs42Run').click();await page.waitForTimeout(400);
          const card=page.locator('#hs42Results .card').filter({hasText:'HS-SUPPORT2-HOSPDEATH-001'});
          if(await card.count()!==1) throw new Error('SUPPORT2 result missing');
          const text=await card.innerText();
          if(!/%/.test(text)||/Astensione/i.test(text)) throw new Error('SUPPORT2 probability missing');
          if(!/Test interno: AUROC 0\.819 · Brier 0\.142/.test(text)) throw new Error('SUPPORT2 metrics missing');
          if(!text.includes('SUPPORT2 hospdead, stato clinico giorno 3')) throw new Error('SUPPORT2 semantic warning missing');
          if(!text.includes('non è una survival probability')) throw new Error('SUPPORT2 horizon warning missing');
          if(!text.includes('Validazione interna storica')) throw new Error('SUPPORT2 validation warning missing');

          const serious=errors.filter(e=>!/Failed to load resource.*api\.fda\.gov/i.test(e));
          if(serious.length) throw new Error(serious.join(' | '));
          await page.screenshot({path:'HealthSolver-0.53-SUPPORT2.png',fullPage:true});
          console.log('SUPPORT2_COVERAGE\n'+covText);
          console.log('SUPPORT2_RESULT\n'+text);
          console.log('SUPPORT2 LIVE PASS');
          await browser.close();
          JS
          node audit.mjs | tee audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healthsolver-053-support2-live
          path: |
            HealthSolver-0.53-SUPPORT2.png
            audit.txt
          retention-days: 14
