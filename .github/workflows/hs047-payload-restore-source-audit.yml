name: HealthSolver 0.47 Payload Restore Source Audit
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs047-payload-restore-source-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract restore implementation from published payload
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/hs-pages origin/gh-pages
          python - <<'PY'
          import base64,gzip,pathlib,re
          p=pathlib.Path('/tmp/hs-pages/docs/payload')
          enc=''.join(x.read_text().strip() for x in sorted(p.glob('part-*.b64')))
          html=gzip.decompress(base64.b64decode(enc)).decode('utf-8')
          needles=['restoreFile','restorePassword','hs_encrypted_workspace_v1','encryptBackup','exportBackup']
          out=[]
          for needle in needles:
              out.append('\n\n===== '+needle+' =====\n')
              for m in list(re.finditer(re.escape(needle),html,re.I))[:12]:
                  a=max(0,m.start()-3500);b=min(len(html),m.end()+7000)
                  out.append(html[a:b])
                  out.append('\n--- occurrence ---\n')
          pathlib.Path('restore-source.txt').write_text(''.join(out))
          print('html bytes',len(html),'matches',{n:len(re.findall(re.escape(n),html,re.I)) for n in needles})
          PY
          head -c 50000 restore-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: healthsolver-047-restore-source
          path: restore-source.txt
          retention-days: 7
