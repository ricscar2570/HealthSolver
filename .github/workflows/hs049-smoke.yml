name: HealthSolver 0.49 UCI Heart Failure Smoke
on:
  push:
    branches: ['main']
    paths:
      - 'predictive/**'
      - '.github/workflows/hs049-smoke.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check predictive/integrated-predictive-ui.js
      - name: Verify heart failure model and registry
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json,math,pathlib
          root=pathlib.Path('predictive')
          reg=json.loads((root/'model-registry-v2.json').read_text())
          assert reg['schema']=='healthsolver.predictive_registry.v2'
          assert tuple(map(int,reg['version'].split('.'))) >= (0,49,0),reg['version']
          assert len(reg['models'])>=9,len(reg['models'])
          ids=[e['model_id'] for e in reg['models']]
          assert len(ids)==len(set(ids))
          assert 'HS-UCI-HFDEATH-001' in ids,ids

          m=json.loads((root/'model-heart-failure-mortality-v1.json').read_text())
          assert m['model_id']=='HS-UCI-HFDEATH-001'
          assert m['dataset']['uci_id']==519
          assert m['dataset']['doi']=='10.24432/C5Z89R'
          assert m['dataset']['license']=='CC BY 4.0'
          assert m['dataset']['instances']==299
          assert m['excluded_source_features']==['time']
          assert 'follow-up duration' in m['leakage_control']
          assert 'time excluded' in m['target_definition']['excluded_feature']
          assert m['features']==[
            'age','anaemia','creatinine_phosphokinase','diabetes','ejection_fraction',
            'high_blood_pressure','platelets','serum_creatinine','serum_sodium','sex','smoking'
          ]
          assert 'time' not in m['features']
          assert m['version'] in {'1.0.0','1.0.1'}
          if m['version']=='1.0.1':
              assert m['dataset']['cohort_scope']['location']=='Faisalabad, Punjab, Pakistan'
              assert m['dataset']['follow_up']['min_days']==4 and m['dataset']['follow_up']['max_days']==285
              assert m['dataset']['follow_up']['mean_days']==130
              assert m['target_definition']['fixed_horizon'] is False
              assert m['target_definition']['survival_model'] is False
              assert 'not mortality at 30, 90, 365 days' in m['time_to_event_limitation']
          q=m['metrics_test']
          assert q['n_total']==299
          assert q['n_train']==179 and q['n_calibration']==60 and q['n_test']==60
          assert q['auroc']>=0.5
          assert q['auprc']>=q['positive_prevalence']
          assert 0<=q['brier']<=1
          assert 0<m['threshold']<1
          assert 'Youden' in m['threshold_selection']
          assert m['research_only'] is True
          assert m['not_clinically_validated'] is True

          score=float(m['logistic']['intercept'])
          for f in m['features']:
              scale=float(m['standardization']['scale'][f]); assert scale>0
              v=float(m['imputation']['values'][f])
              z=(v-float(m['standardization']['mean'][f]))/scale
              score+=z*float(m['logistic']['coefficients'][f])
          z=float(m['calibration']['intercept'])+float(m['calibration']['slope'])*score
          p=1/(1+math.exp(-max(-35,min(35,z))))
          assert math.isfinite(p) and 0<p<1
          report=json.loads((root/'model-heart-failure-mortality-v1-report.json').read_text())
          assert report==q
          entry=next(e for e in reg['models'] if e['model_id']==m['model_id'])
          assert entry['metrics_test']==q
          print({'median_probability':p,'threshold':m['threshold'],'metrics':q})
          PY
      - name: Verify integrated UI references ninth model
        shell: bash
        run: |
          grep -Eq 'HS_INTEGRATED_PREDICTIVE_0531|HS_INTEGRATED_PREDICTIVE_053|HS_INTEGRATED_PREDICTIVE_052|HS_INTEGRATED_PREDICTIVE_0511|HS_INTEGRATED_PREDICTIVE_051|HS_INTEGRATED_PREDICTIVE_050|HS_INTEGRATED_PREDICTIVE_0491|HS_INTEGRATED_PREDICTIVE_049' predictive/integrated-predictive-ui.js
          grep -q 'MODELLI SUPERVISIONATI' predictive/integrated-predictive-ui.js
          grep -q 'HS-UCI-HFDEATH-001' predictive/integrated-predictive-ui.js
          grep -Eq 'Insufficienza cardiaca · (DEATH_EVENT coorte UCI 519|mortalità nel follow-up)' predictive/integrated-predictive-ui.js
          grep -q 'hs49HeartFailureDetails' predictive/integrated-predictive-ui.js
