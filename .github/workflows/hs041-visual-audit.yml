name: HealthSolver 0.41 Visual Browser Audit
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs041-visual-audit.yml']
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Audit live page and capture screenshot
        shell: bash
        run: |
          cat > audit.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1800}, deviceScaleFactor:1});
          const url='https://ricscar2570.github.io/HealthSolver/?visual=041';
          await page.goto(url,{waitUntil:'networkidle',timeout:120000});
          await page.waitForTimeout(3000);
          const router=page.locator('#hs-router041');
          const count=await router.count();
          console.log('router count',count);
          if(count!==1){
            console.log('body text', (await page.locator('body').innerText()).slice(0,5000));
            throw new Error('Unified router not rendered exactly once');
          }
          const button=page.getByRole('button',{name:'Analizza con tutti i modelli applicabili'});
          if(await button.count()!==1) throw new Error('Unified analyze button not rendered');
          await router.scrollIntoViewIfNeeded();
          await router.screenshot({path:'HealthSolver-0.41-Unified-Router.png'});
          await page.screenshot({path:'HealthSolver-0.41-Full-Page.png',fullPage:true});
          console.log('router text', (await router.innerText()).slice(0,4000));
          await browser.close();
          JS
          node audit.mjs | tee visual-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: healthsolver-041-visual-audit
          path: |
            HealthSolver-0.41-Unified-Router.png
            HealthSolver-0.41-Full-Page.png
            visual-audit.txt
          retention-days: 14
