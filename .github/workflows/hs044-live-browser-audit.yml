name: HealthSolver 0.44 UCI HCV Live Browser Audit
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs044-live-browser-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify live UCI HCV integration
        shell: bash
        run: |
          cat > audit.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1600}});
          await page.goto('https://ricscar2570.github.io/HealthSolver/?audit=044-hcv',{waitUntil:'networkidle',timeout:120000});
          await page.waitForFunction(()=>document.body.innerText.includes('Clinical Coach') && document.body.innerText.includes('Expert Mode'),{timeout:30000});

          const expert=page.locator('aside .nav[data-page="intelligence"]');
          if(await expert.count()!==1) throw new Error('Expert Mode nav missing');
          await expert.click();
          await page.waitForTimeout(600);

          const block=page.locator('#hs-predictive-integrated');
          if(await block.count()!==1 || !(await block.isVisible())) throw new Error('Predictive block missing');
          const initialText=await block.innerText();
          if(!initialText.includes('4 MODELLI SUPERVISIONATI')) throw new Error('Fourth-model badge missing');
          if(!initialText.includes('Pattern epatico HCV / malattia epatica')) throw new Error('HCV model coverage card missing');

          // Reuse dossier age / sex.
          await page.evaluate(()=>{
            const age=document.getElementById('ciAge')||document.getElementById('coachAge');
            if(!age) throw new Error('age field missing');
            age.value='52';age.dispatchEvent(new Event('input',{bubbles:true}));age.dispatchEvent(new Event('change',{bubbles:true}));
            const sex=document.getElementById('ciSex')||document.getElementById('coachSex');
            if(!sex) throw new Error('sex field missing');
            if(sex.tagName==='SELECT'){
              const options=[...sex.options].map(o=>o.value);
              const v=options.find(x=>/^(m|male|maschio|1)$/i.test(x)) || options.find(x=>x);
              if(!v) throw new Error('no usable sex option');
              sex.value=v;
            }else sex.value='M';
            sex.dispatchEvent(new Event('input',{bubbles:true}));sex.dispatchEvent(new Event('change',{bubbles:true}));
          });

          const details=page.locator('#hs44HcvDetails');
          if(await details.count()!==1) throw new Error('HCV specialist supplement missing');
          await details.evaluate(el=>{el.open=true});

          const vals={
            hs44_alb:'34',hs44_alp:'70',hs44_alt:'55',hs44_ast:'95',hs44_bil:'25',
            hs44_che:'5.6',hs44_chol:'4.3',hs44_crea:'82',hs44_ggt:'125',hs44_prot:'70'
          };
          for(const [id,v] of Object.entries(vals)){
            const loc=page.locator('#'+id);
            if(await loc.count()!==1) throw new Error('missing HCV field '+id);
            await loc.fill(v);
          }

          const run=page.locator('#hs42Run');
          if(await run.count()!==1) throw new Error('predict button missing');
          await run.click();
          await page.waitForTimeout(500);

          const results=page.locator('#hs42Results');
          const text=await results.innerText();
          if(!text.includes('HS-UCI-HCV-001')) throw new Error('HCV result card missing');
          const hcvCard=results.locator('.card').filter({hasText:'HS-UCI-HCV-001'});
          if(await hcvCard.count()!==1) throw new Error('HCV result card count invalid');
          const hcvText=await hcvCard.innerText();
          if(!/%/.test(hcvText)) throw new Error('HCV numeric probability not rendered');
          if(/Astensione/i.test(hcvText)) throw new Error('HCV model unexpectedly abstained with complete input');

          await block.scrollIntoViewIfNeeded();
          await block.screenshot({path:'HealthSolver-0.44-UCI-HCV-Predictive.png'});
          await page.screenshot({path:'HealthSolver-0.44-Expert-Mode.png',fullPage:true});
          console.log('HCV_RESULT\n'+hcvText);
          console.log('PREDICTIVE_BLOCK\n'+(await block.innerText()).slice(0,7000));
          await browser.close();
          JS
          node audit.mjs | tee audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: healthsolver-044-uci-hcv-live
          path: |
            HealthSolver-0.44-UCI-HCV-Predictive.png
            HealthSolver-0.44-Expert-Mode.png
            audit.txt
          retention-days: 14
