name: HealthSolver 0.56.1 In-App Complete Guide Repack
# final 0.56.1 guide repack
# bootstrap-fix repack
# 0.56.1 complete in-app guide
# preserves 0.56.0 common-outcome transport layer
# preserves 0.55.0 deterministic ensemble-intelligence layer
# final RAI terminology/public-parity repack
# 0.52 final predictive-provenance repack
# 0.50 license/provenance clarification
# registry 0.47.1 synchronization
# final audited registry semantic-version repack
# 0.42 cardiac fallback integration
# 0.42 completion-status fix
# 0.42 visible-release-branding fix
# rerun after predictive module path/placement fix
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs041-repack-pages.yml']
permissions:
  contents: write
jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild standalone payload with predictive modules embedded
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/hs-pages origin/gh-pages
          python - <<'PY'
          import base64,gzip,hashlib,json,pathlib,re,shutil
          main=pathlib.Path('.')
          pages=pathlib.Path('/tmp/hs-pages')
          payload_dir=pages/'docs'/'payload'
          parts=sorted(payload_dir.glob('part-*.b64'))
          assert parts, 'no payload parts'
          b64=''.join(p.read_text().strip() for p in parts)
          html=gzip.decompress(base64.b64decode(b64)).decode('utf-8')
          pe=(main/'predictive'/'predictive-engine.js').read_text()
          integrated=(main/'predictive'/'integrated-predictive-ui.js').read_text()
          guide_js=(main/'guide'/'in-app-guide.js').read_text()
          guide_html=(main/'guide'/'in-app-guide.html').read_text()
          registry=json.loads((main/'predictive'/'model-registry-v2.json').read_text())
          ensemble=json.loads((main/'predictive'/'ensemble-intelligence-v1.json').read_text())
          transport=json.loads((main/'predictive'/'common-outcome-transport-v1.json').read_text())
          model_files=[m['file'] for m in registry['models']]
          models={name:json.loads((main/'predictive'/name).read_text()) for name in model_files}
          bundle=json.dumps({'registry':registry,'models':models},separators=(',',':'),ensure_ascii=False)
          ensemble_bundle=json.dumps(ensemble,separators=(',',':'),ensure_ascii=False)
          transport_bundle=json.dumps(transport,separators=(',',':'),ensure_ascii=False)
          assert '</script>' not in pe.lower()
          assert '</script>' not in integrated.lower()
          assert '</script>' not in guide_js.lower()
          assert '</script>' not in guide_html.lower()
          guide_html_bundle=json.dumps(guide_html,ensure_ascii=False)
          assert '</script>' not in bundle.lower()
          assert '</script>' not in ensemble_bundle.lower()
          assert '</script>' not in transport_bundle.lower()
          # Remove any prior embedded 0.39/0.40/0.41 overlay block if this workflow is rerun.
          html=re.sub(r'\n<!-- HS_PREDICTIVE_OVERLAY_BEGIN -->.*?<!-- HS_PREDICTIVE_OVERLAY_END -->\n',
                      '\n',html,flags=re.S)
          # The preserved 0.32 visit/laboratory workspace uses a browser-local encrypted
          # vault. A sandboxed srcdoc iframe without allow-same-origin has an opaque
          # origin and cannot reliably access localStorage. The iframe content is
          # trusted, fully embedded HealthSolver code; enable same-origin storage.
          html=html.replace(
              'sandbox="allow-scripts allow-forms allow-downloads allow-modals allow-popups allow-popups-to-escape-sandbox"',
              'sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals allow-popups allow-popups-to-escape-sandbox"'
          )
          # The nested preserved Real Data Lab is itself a trusted HealthSolver
          # srcdoc iframe. It contains real forms (classification/training/import)
          # and browser-local workspace storage, so it needs both permissions too.
          html=html.replace(
              'sandbox=\\\"allow-scripts allow-downloads allow-modals allow-popups allow-popups-to-escape-sandbox\\\"',
              'sandbox=\\\"allow-scripts allow-same-origin allow-forms allow-downloads allow-modals allow-popups allow-popups-to-escape-sandbox\\\"'
          )
          overlay='\n<!-- HS_PREDICTIVE_OVERLAY_BEGIN -->\n<script>window.__HS_PREDICTIVE_BUNDLE__='+bundle+';window.__HS_ENSEMBLE_CONFIG__='+ensemble_bundle+';window.__HS_COMMON_OUTCOME_TRANSPORT__='+transport_bundle+';window.__HS_GUIDE_HTML__='+guide_html_bundle+';</script>\n<script>\n'+integrated+'\n'+guide_js+'\n</script>\n<!-- HS_PREDICTIVE_OVERLAY_END -->\n'
          assert '</body>' in html.lower()
          pos=html.lower().rfind('</body>')
          html=html[:pos]+overlay+html[pos:]
          data=html.encode('utf-8')
          sha=hashlib.sha256(data).hexdigest()
          gz=gzip.compress(data,compresslevel=9,mtime=0)
          enc=base64.b64encode(gz).decode('ascii')
          chunks=[enc[i:i+400000] for i in range(0,len(enc),400000)]
          for p in payload_dir.glob('part-*.b64'): p.unlink()
          for i,ch in enumerate(chunks):
              (payload_dir/f'part-{i:02d}.b64').write_text(ch+'\n')
          # Build a clean loader that only verifies and launches the now self-contained app.
          part_names=[f'part-{i:02d}.b64' for i in range(len(chunks))]
          loader=f'''<!doctype html>
          <html lang="it"><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="robots" content="noindex,nofollow">
          <title>HealthSolver 0.56.1 — Complete In-App Guide</title>
          <style>
          html,body{{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1220;color:#e6edf7}}
          main{{max-width:780px;margin:10vh auto;padding:32px}}.card{{background:#121c2e;border:1px solid #25344e;border-radius:18px;padding:28px;box-shadow:0 16px 50px #0006}}
          h1{{margin:0 0 10px;font-size:clamp(26px,5vw,42px)}}p{{line-height:1.5;color:#b8c5d9}}
          progress{{width:100%;height:16px;margin:18px 0}}#err{{white-space:pre-wrap;color:#ffb4ab}}.small{{font-size:13px;color:#8fa2bf}}
          </style></head><body><main><div class="card">
          <h1>HealthSolver 0.56.1</h1>
          <p>Complete In-App Guide + Common-Outcome Transport + Ensemble Intelligence + 14-Model Predictive-First UI</p>
          <progress id="p" max="{len(chunks)}" value="0"></progress>
          <div id="status" class="small">Preparazione applicazione.</div><pre id="err"></pre>
          </div></main>
          <script>
          (async()=>{{
           const parts={json.dumps(part_names)};
           const expected="{sha}";
           const status=document.getElementById("status"),p=document.getElementById("p"),err=document.getElementById("err");
           try{{
            if(typeof DecompressionStream!=="function") throw new Error("Browser non compatibile con DecompressionStream/gzip.");
            let b64="";
            for(let i=0;i<parts.length;i++){{
             status.textContent="Caricamento pacchetto "+(i+1)+"/"+parts.length+"…";
             const r=await fetch("./docs/payload/"+parts[i],{{cache:"no-store"}});
             if(!r.ok) throw new Error("Payload non disponibile: "+parts[i]+" ("+r.status+")");
             b64+=(await r.text()).trim();p.value=i+1;
            }}
            status.textContent="Verifica e avvio HealthSolver 0.55.0…";
            const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
            const htmlBytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
            const digest=[...new Uint8Array(await crypto.subtle.digest("SHA-256",htmlBytes))].map(x=>x.toString(16).padStart(2,"0")).join("");
            if(digest!==expected) throw new Error("Controllo SHA-256 applicativo non superato.");
            const html=new TextDecoder().decode(htmlBytes);
            if(!html.includes("HealthSolver")||!html.includes("Clinical Coach")||!html.includes("HS_INTEGRATED_PREDICTIVE_0560")) throw new Error("Marcatori applicativi mancanti.");
            document.open();document.write(html);document.close();
           }}catch(e){{err.textContent="Impossibile avviare HealthSolver.\\n"+(e?.message||String(e));status.textContent="Caricamento interrotto.";}}
          }})();
          </script></body></html>'''
          (pages/'index.html').write_text(loader)
          v=json.loads((pages/'version.json').read_text())
          v['version']='0.56.1'
          v['release']='Complete In-App Guide + Common-Outcome Transport Layer + Ensemble Intelligence + 14-Model Predictive-First UI + Clinical Coach Research Edition'
          v['source_sha256']=sha
          v['payload_parts']=len(chunks)
          v['predictive_modules_embedded']=True
          v['integrated_predictive_ui']=True
          v['predictive_first_ui']=True
          v['uci_hcv_integrated']=True
          v['nhanes_2017_2018_integrated']=True
          v['nhis_2023_integrated']=True
          v['uci_diabetes_readmission_integrated']=True
          v['full_audit_remediation']=True
          v['uci_thyroid_recurrence_integrated']=True
          v['uci_heart_failure_integrated']=True
          v['scientific_semantics_remediation']=True
          v['cdc_diabetes_indicators_integrated']=True
          v['uci_sepsis_survival_integrated']=True
          v['sepsis_audit_semantics_remediation']=True
          v['uci_mi_fatal_outcome_integrated']=True
          v['support2_hospital_death_integrated']=True
          v['eicu_demo_hospital_death_integrated']=True
          v['eicu_semantics_remediation']=True
          v['ensemble_intelligence_integrated']=True
          v['ensemble_intelligence_version']='1.0.0'
          v['common_outcome_transport_integrated']=True
          v['common_outcome_transport_version']='1.0.0'
          v['common_outcome_transport_model_id']=transport['model_id']
          v['common_outcome_transport_qualification']=transport['qualification_status']
          v['in_app_guide_integrated']=True
          v['in_app_guide_version']='1.0.0'
          v['in_app_guide_embedded']=True
          v['in_app_guide_screenshots']=8
          v['code_audit_remediation']=True
          v['predictive_models']=[m['model_id'] for m in registry['models']]
          v['predictive_model_count']=len(registry['models'])
          v.pop('unified_router',None)
          (pages/'version.json').write_text(json.dumps(v,indent=2)+'\n')
          # Keep the separately addressable predictive assets synchronized with
          # the exact registry/models embedded into the standalone payload.
          public_guide=pages/'guide'
          if public_guide.exists():
              shutil.rmtree(public_guide)
          shutil.copytree(main/'guide',public_guide)
          public_predictive=pages/'predictive'
          if public_predictive.exists():
              shutil.rmtree(public_predictive)
          shutil.copytree(main/'predictive',public_predictive)
          print(json.dumps({'source_sha256':sha,'gzip_bytes':len(gz),'payload_parts':len(chunks),'html_bytes':len(data)},indent=2))
          PY
          cd /tmp/hs-pages
          git config user.name "healthsolver-bot"
          git config user.email "healthsolver-bot@users.noreply.github.com"
          git add index.html version.json docs/payload predictive guide
          git diff --cached --stat
          git commit -m "pages: release HealthSolver 0.56.1 complete in-app guide"
          git push origin HEAD:gh-pages
