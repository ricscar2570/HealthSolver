name: HealthSolver 0.49.1 Scientific Semantics Live Browser Audit
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs0491-live-browser-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify live 0.49.1 scientific semantics
        shell: bash
        run: |
          cat > audit.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='https://ricscar2570.github.io/HealthSolver/';
          const meta=await fetch(base+'version.json?audit=0491-semantics').then(r=>r.json());
          if(meta.version!=='0.49.1') throw new Error('wrong published version '+meta.version);
          if(meta.predictive_model_count!==9) throw new Error('wrong model count');
          if(meta.scientific_semantics_remediation!==true) throw new Error('semantics remediation flag missing');
          const reg=await fetch(base+'predictive/model-registry-v2.json?audit=0491-semantics').then(r=>r.json());
          if(reg.version!=='0.49.1') throw new Error('wrong registry '+reg.version);
          const model=await fetch(base+'predictive/model-heart-failure-mortality-v1.json?audit=0491-semantics').then(r=>r.json());
          if(model.version!=='1.0.1') throw new Error('wrong HF model version');
          if(model.target_definition.fixed_horizon!==false || model.target_definition.survival_model!==false) throw new Error('time semantics flags wrong');
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1800}});
          const errors=[];
          page.on('pageerror',e=>errors.push('PAGE '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
          await page.goto(base+'?audit=0491-semantics',{waitUntil:'networkidle',timeout:120000});
          await page.waitForFunction(()=>document.body.innerText.includes('Clinical Coach')&&document.body.innerText.includes('Expert Mode'),{timeout:30000});
          await page.locator('aside .nav[data-page="intelligence"]').click();
          await page.waitForTimeout(300);
          const block=page.locator('#hs-predictive-integrated');
          const initial=await block.innerText();
          if(!initial.includes('9 MODELLI SUPERVISIONATI')) throw new Error('nine-model badge missing');
          if(!initial.includes('DEATH_EVENT UCI 519')) throw new Error('DEATH_EVENT semantics missing');
          const details=page.locator('#hs49HeartFailureDetails');
          await details.evaluate(el=>{el.open=true});
          const detailsText=await details.innerText();
          if(!detailsText.includes('Faisalabad')) throw new Error('cohort location missing');
          if(!detailsText.includes('NYHA III–IV')) throw new Error('NYHA scope missing');
          if(!detailsText.includes('4 a 285 giorni')) throw new Error('follow-up range missing');
          if(!detailsText.includes('non è una probabilità di sopravvivenza')) throw new Error('survival limitation missing');
          if(await page.locator('#hs49_time').count()!==0) throw new Error('time predictor exposed');
          await page.locator('#ciAge').fill('65');
          const sex=page.locator('#ciSex');
          const opts=await sex.locator('option').evaluateAll(os=>os.map(o=>({v:o.value,t:o.textContent.trim()})));
          const male=opts.find(o=>/masch|male|^m$/i.test(o.t)||/^(m|male|maschio|1)$/i.test(o.v));
          if(!male) throw new Error('male option missing');
          await sex.selectOption(male.v);
          const vals={hs49_anaemia:'0',hs49_cpk:'250',hs49_diabetes:'1',hs49_ejection_fraction:'35',hs49_high_blood_pressure:'1',hs49_platelets:'250000',hs49_serum_creatinine:'1.4',hs49_serum_sodium:'137',hs49_smoking:'0'};
          for(const [id,v] of Object.entries(vals)){const loc=page.locator('#'+id);if((await loc.evaluate(e=>e.tagName))==='SELECT')await loc.selectOption(v);else await loc.fill(v);}
          await page.locator('#hs42Run').click(); await page.waitForTimeout(350);
          const card=page.locator('#hs42Results .card').filter({hasText:'HS-UCI-HFDEATH-001'});
          const text=await card.innerText();
          if(!/%/.test(text)||/Astensione/i.test(text)) throw new Error('HF result missing');
          if(!text.includes('non rischio a tempo fisso')) throw new Error('fixed-horizon warning missing in result');
          if(!text.includes('non è una probabilità di sopravvivenza')) throw new Error('survival warning missing in result');
          const serious=errors.filter(e=>!/Failed to load resource.*api\.fda\.gov/i.test(e));
          if(serious.length) throw new Error(serious.join(' | '));
          await page.screenshot({path:'HealthSolver-0.49.1-Semantics.png',fullPage:true});
          console.log('SCIENTIFIC SEMANTICS LIVE PASS');
          await browser.close();
          JS
          node audit.mjs | tee audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healthsolver-0491-semantics-live
          path: |
            HealthSolver-0.49.1-Semantics.png
            audit.txt
          retention-days: 14
