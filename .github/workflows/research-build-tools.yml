name: Offline build tools
on:
  push:
    branches: ['development/real-data-macro1-20261007']
    paths: ['.github/workflows/research-build-tools.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download public Python formatter packages only
        run: |
          python -m pip download --only-binary=:all: --platform any black==25.1.0 --dest tools-wheels
      - uses: actions/upload-artifact@v4
        with:
          name: offline-formatter-wheels
          path: tools-wheels/
          retention-days: 7
