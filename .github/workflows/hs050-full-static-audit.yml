name: HealthSolver 0.50 Full Static Release Audit
# final 0.50 provenance qualification
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs050-full-static-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repository and source integrity
        shell: bash
        run: |
          set -euxo pipefail
          git fsck --full
          test ! -f .env
          test -f .env.example
          test -f .gitignore
          ! git ls-files | grep -E '(^|/)\.env$'
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!README.MD'
          python -m compileall -q backend dashboard tests
          for f in predictive/*.js; do node --check "$f"; done
          python -m pip install --disable-pip-version-check -q pyyaml
          python - <<'PY'
          import json,pathlib,yaml
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' not in p.parts: json.loads(p.read_text(encoding='utf-8'))
          for ext in ('*.yml','*.yaml'):
              for p in pathlib.Path('.').rglob(ext):
                  if '.git' not in p.parts: list(yaml.safe_load_all(p.read_text(encoding='utf-8')))
          print('JSON/YAML/Python/JS parse PASS')
          PY
          npx --yes esbuild@0.25.10 frontend/src/App.js --bundle --loader:.js=jsx --packages=external --outfile=/tmp/healthsolver-legacy-frontend.js
      - name: Preserve all nine 0.49.1 model artifacts byte-for-byte
        shell: bash
        run: |
          set -euxo pipefail
          git diff --exit-code 1849b8ec13e0618d5c1a9898b042ace84f59cc9e --             predictive/model-heart-disease-v1.json             predictive/model-heart-disease-v1-report.json             predictive/model-ckd-v1.json             predictive/model-breast-cancer-v1.json             predictive/model-hcv-v1.json             predictive/model-hcv-v1-report.json             predictive/model-nhanes-diabetes-v1.json             predictive/model-nhanes-diabetes-v1-report.json             predictive/model-nhis-hypertension-v1.json             predictive/model-nhis-hypertension-v1-report.json             predictive/model-diabetes-readmission-v1.json             predictive/model-diabetes-readmission-v1-report.json             predictive/model-thyroid-recurrence-v1.json             predictive/model-thyroid-recurrence-v1-report.json             predictive/model-heart-failure-mortality-v1.json             predictive/model-heart-failure-mortality-v1-report.json
          echo '0.49.1 MODEL ARTIFACT FREEZE PASS'
      - name: Validate all ten predictive artifacts
        shell: bash
        run: |
          python - <<'PY'
          import json,math,pathlib
          root=pathlib.Path('predictive')
          reg=json.loads((root/'model-registry-v2.json').read_text())
          expected=[
            'HS-UCI-HD-001','HS-UCI-CKD-001','HS-UCI-BC-001','HS-UCI-HCV-001',
            'HS-NHANES-DM-001','HS-NHIS-HYP-001','HS-UCI-DMREADM-001',
            'HS-UCI-THYREC-001','HS-UCI-HFDEATH-001','HS-CDC-DIABIND-001'
          ]
          assert reg['schema']=='healthsolver.predictive_registry.v2'
          assert reg['version']=='0.50.0'
          assert [e['model_id'] for e in reg['models']]==expected
          assert len(reg['models'])==10
          for e in reg['models']:
              p=root/e['file']; assert p.exists(),p
              m=json.loads(p.read_text())
              assert m['schema']=='healthsolver.predictive_model.v1'
              assert m['model_id']==e['model_id']
              assert m['research_only'] is True
              assert m['not_clinically_validated'] is True
              fs=m['features']
              assert fs and len(fs)==len(set(fs))
              assert set(m['imputation']['values'])==set(fs)
              assert set(m['standardization']['mean'])==set(fs)
              assert set(m['standardization']['scale'])==set(fs)
              assert set(m['logistic']['coefficients'])==set(fs)
              assert all(float(m['standardization']['scale'][f])>0 for f in fs)
              assert 0<float(m['threshold'])<1
              assert 0<=int(m['abstention']['max_missing_features'])<len(fs)
              q=m['metrics_test']; assert q['n_test']>0
              if all(k in q for k in ('n_train','n_calibration','n_test','n_total')):
                  assert q['n_train']+q['n_calibration']+q['n_test']==q['n_total']
              auc=q.get('auroc',q.get('auroc_weighted'))
              brier=q.get('brier',q.get('brier_weighted'))
              assert auc is not None and .5<=auc<=1
              assert brier is not None and 0<=brier<=1
              score=float(m['logistic']['intercept'])
              for f in fs:
                  v=float(m['imputation']['values'][f])
                  score+=(v-float(m['standardization']['mean'][f]))/float(m['standardization']['scale'][f])*float(m['logistic']['coefficients'][f])
              z=float(m['calibration']['intercept'])+float(m['calibration']['slope'])*score
              prob=1/(1+math.exp(-max(-35,min(35,z))))
              assert math.isfinite(prob) and 0<prob<1
              report=root/(e['file'].replace('.json','-report.json'))
              if report.exists(): assert json.loads(report.read_text())==q
              assert e['metrics_test']==q
              print(m['model_id'],'PASS',prob)
          cdc=json.loads((root/'model-cdc-diabetes-indicators-v1.json').read_text())
          assert cdc['dataset']['uci_id']==891
          assert cdc['dataset']['instances']==253680
          assert cdc['dataset']['features']==21
          assert cdc['target_definition']['source_name']=='Diabetes_binary'
          assert cdc['target_definition']['prediabetes_and_diabetes_combined'] is True
          assert cdc['target_definition']['future_risk'] is False
          assert cdc['target_definition']['clinical_diagnosis'] is False
          assert len(cdc['features'])==21
          assert cdc['metrics_test']['n_train']==152208
          assert cdc['metrics_test']['n_calibration']==50736
          assert cdc['metrics_test']['n_test']==50736
          assert 'Cross-sectional' in cdc['temporal_semantics']
          assert 'source-label classification' in cdc['leakage_review']
          print('TEN MODEL STATIC INTEGRITY PASS')
          PY
      - name: Import legacy FastAPI safely
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q fastapi sqlalchemy joblib scikit-learn prometheus-fastapi-instrumentator prometheus-client cryptography
          python - <<'PY'
          import os
          for k in list(os.environ):
              if k.startswith('ENABLE_LEGACY_'): os.environ.pop(k,None)
          import backend.main as m
          paths=set(m.app.openapi().get('paths',{}))
          assert '/' in paths
          assert '/predict/predict' in paths
          assert '/admin/train' not in paths
          assert '/cnn/analyze' not in paths
          assert m.root()['legacy'] is True
          print('Legacy FastAPI safe import PASS')
          PY
      - name: Verify release packaging invariants
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'HS_INTEGRATED_PREDICTIVE_050' .github/workflows/hs041-repack-pages.yml
          grep -q "v\['version'\]='0.50.0'" .github/workflows/hs041-repack-pages.yml
          grep -q 'cdc_diabetes_indicators_integrated' .github/workflows/hs041-repack-pages.yml
          grep -q "shutil.copytree(main/'predictive',public_predictive)" .github/workflows/hs041-repack-pages.yml
          grep -q '10 MODELLI SUPERVISIONATI' predictive/integrated-predictive-ui.js
          grep -q 'HS-CDC-DIABIND-001' predictive/integrated-predictive-ui.js
          grep -q 'hs50CdcDiabetesDetails' predictive/integrated-predictive-ui.js
