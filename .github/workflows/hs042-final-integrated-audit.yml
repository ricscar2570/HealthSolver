name: HealthSolver 0.42 Final Integrated UI Audit
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/hs042-final-integrated-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify integrated predictive UX and run one model
        shell: bash
        run: |
          cat > audit.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1800}});
          await page.goto('https://ricscar2570.github.io/HealthSolver/?audit=042-final',{waitUntil:'networkidle',timeout:120000});
          await page.waitForTimeout(2500);

          if(await page.locator('#hs-pe040').count()!==0) throw new Error('Legacy 0.40 predictive panel still visible');
          if(await page.locator('#hs-router041').count()!==0) throw new Error('Legacy 0.41 router panel still visible');

          const expert=page.locator('aside .nav[data-page="intelligence"]');
          if(await expert.count()!==1) throw new Error('Expert Mode navigation not found');
          await expert.click();
          await page.waitForTimeout(700);

          const host=page.locator('#page-intelligence');
          const integrated=host.locator('#hs-predictive-integrated');
          if(await integrated.count()!==1) throw new Error('Integrated predictive card not inside Expert Mode');
          if(!(await integrated.isVisible())) throw new Error('Integrated predictive card not visible in Expert Mode');

          const text=await integrated.innerText();
          if(!text.includes('Predizione dai dati già inseriti')) throw new Error('Integrated prediction heading missing');
          if(!text.includes('Non devi ricompilare un secondo caso')) throw new Error('Single-dossier UX message missing');

          // Use specialist FNA fields embedded in Expert Mode to guarantee one runnable model.
          const fnaDetails=page.locator('#hs42FnaDetails');
          if(await fnaDetails.count()!==1) throw new Error('Integrated FNA details section missing');
          await fnaDetails.evaluate(el=>{el.open=true});
          const vals={
            hs42_radius1:'17.99',hs42_texture1:'10.38',hs42_perimeter1:'122.8',hs42_area1:'1001',
            hs42_smoothness1:'0.1184',hs42_compactness1:'0.2776',hs42_concavity1:'0.3001',
            hs42_concave_points1:'0.1471',hs42_symmetry1:'0.2419',hs42_fractal_dimension1:'0.07871'
          };
          for(const [id,v] of Object.entries(vals)){
            const loc=page.locator('#'+id);
            if(await loc.count()!==1) throw new Error('Missing integrated FNA field '+id);
            await loc.fill(v);
          }

          const run=page.locator('#hs42Run');
          if(await run.count()!==1) throw new Error('Integrated run button missing');
          await run.click();
          await page.waitForTimeout(500);

          const results=page.locator('#hs42Results');
          const resultText=await results.innerText();
          if(!resultText.includes('HS-UCI-BC-001')) throw new Error('Breast FNA predictive result missing');
          if(!/%/.test(resultText)) throw new Error('No predictive percentage rendered');

          await integrated.scrollIntoViewIfNeeded();
          await integrated.screenshot({path:'HealthSolver-0.42-Integrated-Prediction.png'});
          await page.screenshot({path:'HealthSolver-0.42-Expert-Mode-Full.png',fullPage:true});

          console.log('INTEGRATED_TEXT\n'+(await integrated.innerText()).slice(0,6000));
          console.log('RESULT_TEXT\n'+resultText.slice(0,3000));
          await browser.close();
          JS
          node audit.mjs | tee audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: healthsolver-042-final-integrated-ui
          path: |
            HealthSolver-0.42-Integrated-Prediction.png
            HealthSolver-0.42-Expert-Mode-Full.png
            audit.txt
          retention-days: 14
