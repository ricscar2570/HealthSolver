<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>HealthSolver 0.37.0 — Clinical Coach</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1220;color:#e6edf7}
    main{max-width:760px;margin:12vh auto;padding:32px}
    .card{background:#121c2e;border:1px solid #25344e;border-radius:18px;padding:28px;box-shadow:0 16px 50px #0006}
    h1{margin:0 0 10px;font-size:clamp(26px,5vw,42px)}
    p{line-height:1.5;color:#b8c5d9}
    progress{width:100%;height:16px;margin:18px 0}
    #err{white-space:pre-wrap;color:#ffb4ab}
    .small{font-size:13px;color:#8fa2bf}
  </style>
</head>
<body>
<main><div class="card">
  <h1>HealthSolver 0.37.0</h1>
  <p>Caricamento della Clinical Coach Research Edition…</p>
  <progress id="p" max="5" value="0"></progress>
  <div id="status" class="small">Preparazione applicazione.</div>
  <pre id="err"></pre>
</div></main>
<script>
(async()=>{
  const parts=["part-00.b64","part-01.b64","part-02.b64","part-03.b64","part-04.b64"];
  const status=document.getElementById("status"), p=document.getElementById("p"), err=document.getElementById("err");
  try{
    if(typeof DecompressionStream!=="function") throw new Error("Browser non compatibile con DecompressionStream/gzip. Usa una versione aggiornata di Chrome, Edge, Firefox o Safari.");
    let b64="";
    for(let i=0;i<parts.length;i++){
      status.textContent="Caricamento pacchetto "+(i+1)+"/"+parts.length+"…";
      const r=await fetch("./docs/payload/"+parts[i],{cache:"no-store"});
      if(!r.ok) throw new Error("Payload non disponibile: "+parts[i]+" ("+r.status+")");
      b64+=(await r.text()).trim();
      p.value=i+1;
    }
    status.textContent="Avvio HealthSolver…";
    const bin=atob(b64), bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html=await new Response(stream).text();
    if(!html.includes("HealthSolver")||!html.includes("Clinical Coach")) throw new Error("Controllo integrità applicativo non superato.");
    document.open(); document.write(html); document.close();
  }catch(e){
    err.textContent="Impossibile avviare HealthSolver.\n"+(e&&e.message?e.message:String(e));
    status.textContent="Caricamento interrotto.";
  }
})();
</script>
</body>
</html>
